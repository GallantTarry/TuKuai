<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 58 58" shape-rendering="crispEdges">
  <!-- 像素风掌机外轮廓 -->
  <path fill="#131522" d="M12 0h34v1h1v1h1v51h-1v2h-1v1h-2v1h-1v1H12v-1h-1v-1h-1V2h1V1h1V0z"/>
  <!-- 浅灰米色机身底色 -->
  <path fill="#d1d2c4" d="M11 2h36v51h-1v1h-1v1h-1v1H11V2z"/>
  <!-- 顶部与左侧高光带 -->
  <rect x="11" y="2" width="3" height="2" fill="#e1e2d8"/>
  <rect x="11" y="5" width="1" height="51" fill="#e1e2d8"/>
  <!-- 右侧与底部阴影（严格贴合右下角圆弧轮廓） -->
  <rect x="46" y="4" width="1" height="49" fill="#a6a495"/>
  <rect x="45" y="51" width="1" height="3" fill="#a6a495"/>
  <rect x="44" y="53" width="1" height="2" fill="#a6a495"/>
  <rect x="35" y="54" width="9" height="1" fill="#a6a495"/>
  <rect x="35" y="55" width="10" height="1" fill="#a6a495"/>
  <rect x="11" y="56" width="32" height="1" fill="#8f8e82"/>
  <rect x="25" y="55" width="5" height="1" fill="#bdbdb0"/>
  <rect x="26" y="56" width="5" height="1" fill="#7c7d76"/>
  <!-- 顶部插槽与边框接缝 -->
  <rect x="12" y="1" width="34" height="1" fill="#2e2d34"/>
  <rect x="11" y="4" width="36" height="1" fill="#a4a498"/>
  <rect x="14" y="2" width="1" height="2" fill="#a4a498"/>
  <rect x="43" y="2" width="1" height="2" fill="#a4a498"/>
  <rect x="46" y="4" width="1" height="1" fill="#7c7d76"/>

  <!-- 屏幕外框（灰紫面板） -->
  <path fill="#86808a" d="M14 7h28v1h2v19h-1v1h-2v1H15v-1h-1v-1h-1V8h1V7z"/>
  <!-- 电源指示灯 -->
  <rect x="15" y="15" width="2" height="1" fill="#141522"/>

  <!-- 绿色显示屏黑框与绿底 -->
  <rect x="19" y="9" width="20" height="18" fill="#131522"/>
  <rect x="20" y="10" width="18" height="16" fill="#49a54e"/>
  <!-- 屏幕顶部内阴影 -->
  <rect x="20" y="10" width="18" height="1" fill="#38783f"/>
  <!-- 屏幕中央像素风 < > 代码符号 -->
  <g fill="#285c30">
    <rect x="25" y="15" width="2" height="2"/>
    <rect x="23" y="17" width="2" height="2"/>
    <rect x="25" y="19" width="2" height="2"/>
    <rect x="31" y="15" width="2" height="2"/>
    <rect x="33" y="17" width="2" height="2"/>
    <rect x="31" y="19" width="2" height="2"/>
  </g>

  <!-- 十字方向键（D-Pad） -->
  <g id="d-pad">
    <path fill="#111320" d="M17 35h4v3h3v4h-3v3h-4v-3h-3v-4h3v-3z"/>
    <path fill="#2a2e34" d="M18 36h2v3h3v2h-3v3h-2v-3h-3v-2h3v-3z"/>
    <rect x="18" y="36" width="2" height="1" fill="#4e4f53"/>
    <rect x="15" y="39" width="1" height="2" fill="#4e4f53"/>
    <rect x="18" y="39" width="2" height="2" fill="#111423"/>
  </g>

  <!-- A / B 红色功能键 -->
  <g id="ab-buttons">
    <path fill="#111421" d="M40 35h3v1h1v3h-1v1h-3v-1h-1v-3h1v-1z"/>
    <rect x="40" y="36" width="3" height="3" fill="#9d2748"/>
    <rect x="40" y="36" width="1" height="1" fill="#c64459"/>
    <path fill="#111421" d="M34 38h3v1h1v3h-1v1h-3v-1h-1v-3h1v-1z"/>
    <rect x="34" y="39" width="3" height="3" fill="#9d2748"/>
    <rect x="34" y="39" width="1" height="1" fill="#c64459"/>
    <g fill="#131522">
      <path d="M36.3 44h1.3v0.4h0.4v0.6h-0.3v0.2h0.3v0.7h-0.4v0.4h-1.3V44zm0.4 0.4v0.5h0.8v-0.5h-0.8zm0 0.9v0.6h0.8v-0.6h-0.8z"/>
      <path d="M42.7 41h0.8v0.4h0.4v1.9h-0.4v-0.7h-0.8v0.7h-0.4v-1.9h0.4V41zm0 0.5v0.7h0.8v-0.7h-0.8z"/>
    </g>
  </g>

  <!-- SELECT / START 斜向按键 -->
  <g fill="#0f111e">
    <path d="M25 47h2v1h-1v1h-3v-1h2v-1z"/>
    <path d="M31 47h2v1h-1v1h-3v-1h2v-1z"/>
  </g>

  <!-- 右下角斜向扬声器开孔（4 组平行斜槽，严格收在机身轮廓内） -->
  <path fill="#b8b7aa" d="M38 50h6v3h-1v1h-7v-3h2v-1z"/>
  <g fill="#86867e">
    <rect x="35" y="50" width="1" height="2"/>
    <rect x="36" y="52" width="1" height="2"/>
    <rect x="37" y="53" width="1" height="2"/>
    <rect x="38" y="49" width="1" height="2"/>
    <rect x="39" y="51" width="1" height="2"/>
    <rect x="40" y="53" width="1" height="1"/>
    <rect x="40" y="48" width="1" height="2"/>
    <rect x="41" y="50" width="1" height="2"/>
    <rect x="42" y="52" width="1" height="1"/>
    <rect x="42" y="47" width="1" height="2"/>
    <rect x="43" y="49" width="1" height="2"/>
    <rect x="44" y="51" width="1" height="1"/>
  </g>
</svg>
