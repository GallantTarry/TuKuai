<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyKuai | 可视化脚本盒子</title>
    <link rel="icon" href="imgs/script.ico">
    <style>
        :root {
            --primary-color: #0f0;
            --bg-color: #050505;
            --terminal-bg: rgba(0, 20, 0, 0.8);
            --glass-bg: rgba(20, 20, 20, 0.6);
            --glass-border: rgba(0, 255, 0, 0.2);
            --glow-color: rgba(0, 255, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            background-color: var(--bg-color);
            color: var(--primary-color);
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
        }

        /* 针对 PyKuai 的极客终端主题滚动条 */
        body {
            scrollbar-width: thin;
            scrollbar-color: var(--primary-color) var(--bg-color);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 0, 0.4);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-color);
            box-shadow: 0 0 10px var(--primary-color);
        }

        /* 矩阵背景 */
        #matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            opacity: 0.4;
        }

        /* CRT 扫描线和边角压暗效果 */
        .crt::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 999;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .crt::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.6) 100%);
            z-index: 998;
            pointer-events: none;
        }

        /* ================= 顶部导航栏 (融合 BlackHole 风格) ================= */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .logo-container:hover {
            transform: scale(1.05);
        }

        /* 【核心修改】：直角矩形容器包裹图标 */
        .logo-container img {
            width: 40px;
            height: 40px;
            border-radius: 4px; /* 微直角矩形，去除原先的 50% 圆角 */
            border: 1px solid var(--primary-color); /* 增加极客绿边框包裹 */
            padding: 3px; /* 增加内边距，形成包裹感 */
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.4);
            transition: transform 0.3s ease;
            background-color: var(--terminal-bg);
        }

        .logo-container img.playing {
            animation: spin-slow 10s linear infinite;
        }

        @keyframes spin-slow {
            100% { transform: rotate(360deg); }
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
            text-shadow: 0 0 10px var(--primary-color);
            letter-spacing: 2px;
        }

        /* 毛玻璃说明书按钮 */
        .buy-btn {
            background: rgba(0, 20, 0, 0.5);
            border: 1px solid var(--glass-border);
            color: var(--primary-color);
            padding: 10px 24px;
            border-radius: 20px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            backdrop-filter: blur(10px);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            position: relative;
        }

        .buy-btn:hover {
            background: rgba(0, 255, 0, 0.15);
            border-color: var(--primary-color);
            box-shadow: 0 0 25px var(--glow-color);
            transform: translateY(-2px);
            color: #fff;
        }

        .price-tag {
            background: linear-gradient(135deg, #00aa00, #00ff00);
            color: #000;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
            box-shadow: inset 0 0 5px rgba(255,255,255,0.4);
        }

        /* ================= 主体内容区 ================= */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        header.main-header {
            text-align: center;
            margin-bottom: 40px;
        }

        /* Glitch 效果 */
        .glitch {
            font-size: 4rem;
            font-weight: bold;
            text-transform: uppercase;
            position: relative;
            display: inline-block;
            text-shadow: 0 0 15px var(--primary-color);
            margin-bottom: 10px;
            letter-spacing: 5px;
        }

        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        .glitch::before {
            left: 2px;
            text-shadow: -2px 0 #00ff00;
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim 3s infinite linear alternate-reverse;
        }

        .glitch::after {
            left: -2px;
            text-shadow: -2px 0 #00ff00;
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim 2.5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(20px, 9999px, 85px, 0); }
            20% { clip: rect(92px, 9999px, 14px, 0); }
            40% { clip: rect(43px, 9999px, 55px, 0); }
            60% { clip: rect(10px, 9999px, 93px, 0); }
            80% { clip: rect(71px, 9999px, 2px, 0); }
            100% { clip: rect(58px, 9999px, 33px, 0); }
        }

        .author {
            font-size: 1.2rem;
            letter-spacing: 2px;
            opacity: 0.8;
            text-shadow: 0 0 5px var(--primary-color);
        }

        /* 图像展示区 */
        .showcase {
            border: 2px solid var(--primary-color);
            padding: 10px;
            background: var(--terminal-bg);
            box-shadow: 0 0 15px var(--primary-color);
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
        }

        /* 黑客绿色滤镜 */
        .showcase img {
            width: 100%;
            max-width: 100%;
            height: auto;
            display: block;
            filter: grayscale(100%) sepia(100%) hue-rotate(75deg) brightness(1.2) contrast(1.5);
            transition: all 0.5s ease;
        }

        .showcase:hover img {
            filter: grayscale(0%) sepia(0%) hue-rotate(0deg) brightness(1) contrast(1);
        }

        .showcase::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,255,0,0) 0%, rgba(0,255,0,0.15) 50%, rgba(0,255,0,0) 100%);
            animation: scan 3s infinite linear;
            pointer-events: none;
            z-index: 2;
        }

        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        /* 终端打字机区 */
        .terminal {
            background: var(--terminal-bg);
            border: 1px solid var(--primary-color);
            padding: 20px;
            margin-bottom: 40px;
            min-height: 220px;
            box-shadow: inset 0 0 20px rgba(0, 255, 0, 0.2);
            font-size: 1.1rem;
            line-height: 1.6;
            word-break: break-all;
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.2em;
            background-color: var(--primary-color);
            vertical-align: middle;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* 盒子特性网格 */
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .feature-card {
            border: 1px dashed var(--primary-color);
            padding: 20px;
            background: rgba(0, 20, 0, 0.4);
            transition: all 0.3s;
            cursor: crosshair;
            position: relative;
        }

        .feature-card:hover {
            background: var(--primary-color);
            color: var(--bg-color);
            box-shadow: 0 0 15px var(--primary-color);
            transform: translateY(-5px);
        }

        .feature-card::before {
            content: '>>';
            position: absolute;
            top: 20px;
            right: 20px;
            opacity: 0.3;
            font-weight: bold;
        }

        .feature-card:hover::before {
            opacity: 1;
            color: var(--bg-color);
        }

        .feature-card h3 {
            margin-bottom: 10px;
            font-size: 1.2rem;
            border-bottom: 1px solid var(--primary-color);
            padding-bottom: 5px;
            display: inline-block;
        }

        .feature-card:hover h3 {
            border-bottom: 1px solid var(--bg-color);
        }

        /* 下载按钮 */
        .download-wrapper {
            text-align: center;
            margin-bottom: 50px;
        }

        .download-btn {
            font-size: clamp(13px, 4vw, 18px);
            white-space: nowrap;
            padding: 15px 5vw;
            box-sizing: border-box;
            max-width: 100%;
            display: inline-block;
            font-weight: bold;
            color: var(--primary-color);
            background: transparent;
            border: 2px solid var(--primary-color);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
        }

        .download-btn:hover {
            background: var(--primary-color);
            color: var(--bg-color);
            box-shadow: 0 0 30px var(--primary-color);
        }

        .download-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: 0.5s;
        }

        .download-btn:hover::before {
            left: 100%;
        }

        /* 页脚样式 */
        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.9rem;
            opacity: 0.6;
            letter-spacing: 1px;
            text-shadow: 0 0 5px var(--primary-color);
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .top-nav { padding: 15px 20px; }
            .logo-text { font-size: 1.2rem; }
            .buy-btn { padding: 8px 16px; font-size: 0.95rem; }
            .glitch { font-size: 2.5rem; }
            .terminal { font-size: 1rem; min-height: 180px; }
            .features { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body class="crt">
<!-- 动态矩阵雨背景 -->
<canvas id="matrix-bg"></canvas>

<!-- 顶部极客毛玻璃导航栏 -->
<nav class="top-nav">
    <div class="logo-container" id="music-toggle">
        <img src="imgs/script.ico" alt="PyKuai Logo" id="music-disk">
        <div class="logo-text">BGM</div>
        <audio id="bg-music" src="music/Minecraft.mp3" loop></audio>
    </div>

    <a href="docs/PyKuai使用说明书.md" download="PyKuai使用说明书.md" class="buy-btn">
        获取说明
        <span class="price-tag">下载</span>
    </a>
</nav>

<div class="container">
    <header class="main-header">
        <h1 class="glitch" data-text="PyKuai">PyKuai</h1>
        <p class="author">Developed by TuKuai</p>
    </header>

    <main>
        <!-- 软件截图展示区 -->
        <section class="showcase">
            <img src="imgs/main.png" alt="PyKuai Interface">
        </section>

        <!-- 下载执行区 -->
        <section class="download-wrapper">
            <!-- 国内加速直链 -->
            <a href="https://ghproxy.net/https://github.com/GallantTarry/TuKuai/releases/download/20260907/PyKuaiv1.2.4.exe" class="download-btn">>> PyKuai (v1.2.4) <<</a>
        </section>

        <!-- 打字机效果说明区 -->
        <section class="terminal">
            <div id="typewriter" style="display: inline;"></div><span class="cursor"></span>
        </section>

        <!-- 特性大集合网格 -->
        <section class="features">
            <div class="feature-card">
                <h3>[01] 泛用针对</h3>
                <p>具备泛用性与针对性，涵盖不同领域的不同应用场景。</p>
            </div>
            <div class="feature-card">
                <h3>[02] 大集合生态</h3>
                <p>集成生态，Windows 环境下直接独立运行。</p>
            </div>
            <div class="feature-card">
                <h3>[03] 极简即极客</h3>
                <p>摒弃臃肿的UI，回归黑绿终端的浪漫，用最高效的底层代码驱动世界。</p>
            </div>
        </section>

        <footer>
            <p style="color: #64748B; font-size: 0.95rem; letter-spacing: 1px;">
                &copy; 2026 Created by 土块. All rights reserved.
            </p>
        </footer>

    </main>
</div>

<script>
    // --- 1. 音乐播放器逻辑 ---
    const musicToggle = document.getElementById('music-toggle');
    const bgMusic = document.getElementById('bg-music');
    const musicDisk = document.getElementById('music-disk');

    musicToggle.addEventListener('click', () => {
        if (bgMusic.paused) {
            bgMusic.play();
            musicDisk.classList.add('playing');
        } else {
            bgMusic.pause();
            musicDisk.classList.remove('playing');
        }
    });

    // --- 2. Matrix 背景动画逻辑 ---
    const canvas = document.getElementById('matrix-bg');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレゲゼデベペオォコソトノホモヨョロゴゾドボポヴッン';
    const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const nums = '0123456789';
    const alphabet = katakana + latin + nums;

    const fontSize = 16;
    let columns = canvas.width / fontSize;

    let rainDrops = [];
    for (let x = 0; x < columns; x++) {
        rainDrops[x] = 1;
    }

    const draw = () => {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#0F0';
        ctx.font = fontSize + 'px monospace';

        for (let i = 0; i < rainDrops.length; i++) {
            const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
            ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

            if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                rainDrops[i] = 0;
            }
            rainDrops[i]++;
        }
    };
    setInterval(draw, 30);

    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        columns = canvas.width / fontSize;
        rainDrops = [];
        for (let x = 0; x < columns; x++) {
            rainDrops[x] = 1;
        }
    });

    // --- 3. 终端打字机效果逻辑 ---
    const textToType = `root@TuKuai:~# ./pykuai_init.sh
> 正在初始化 PyKuai 环境... [OK]
> 正在加载泛用性脚本库... [OK]
> 正在挂载针对性模块... [OK]
>
> 欢迎来到 PyKuai - 脚本盒子。
> 这是一个不断更新的集成环境的脚本盒子。
> 他具有泛用性和针对性。
> 准备好尝试一下了吗？
>
> Waiting for user action...`;

    const typeWriterElement = document.getElementById('typewriter');
    let i = 0;

    function typeWriter() {
        if (i < textToType.length) {
            if (textToType.charAt(i) === '\n') {
                typeWriterElement.innerHTML += '<br>';
            } else {
                typeWriterElement.innerHTML += textToType.charAt(i);
            }
            i++;
            setTimeout(typeWriter, Math.random() * 40 + 20);
        }
    }

    // 延迟1秒启动打字机
    setTimeout(typeWriter, 1000);
</script>
</body>
</html>
