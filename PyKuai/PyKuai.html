<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyKuai - 终极脚本盒子 | By TuKuai</title>
    <link rel="icon" href="imgs/script.ico">
    <style>
        :root {
            --primary-color: #0f0;
            --bg-color: #050505;
            --terminal-bg: rgba(0, 20, 0, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            background-color: var(--bg-color);
            color: var(--primary-color);
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
        }

        /* 矩阵背景 */
        #matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            opacity: 0.4;
        }

        /* CRT 扫描线和边角压暗效果 */
        .crt::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 999;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .crt::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.6) 100%);
            z-index: 998;
            pointer-events: none;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        /* Glitch 效果 */
        .glitch {
            font-size: 4rem;
            font-weight: bold;
            text-transform: uppercase;
            position: relative;
            display: inline-block;
            text-shadow: 0 0 15px var(--primary-color);
            margin-bottom: 10px;
            letter-spacing: 5px;
        }

        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        .glitch::before {
            left: 2px;
            text-shadow: -2px 0 #00ff00;
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim 3s infinite linear alternate-reverse;
        }

        .glitch::after {
            left: -2px;
            text-shadow: -2px 0 #00ff00;
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim 2.5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(20px, 9999px, 85px, 0); }
            20% { clip: rect(92px, 9999px, 14px, 0); }
            40% { clip: rect(43px, 9999px, 55px, 0); }
            60% { clip: rect(10px, 9999px, 93px, 0); }
            80% { clip: rect(71px, 9999px, 2px, 0); }
            100% { clip: rect(58px, 9999px, 33px, 0); }
        }

        .author {
            font-size: 1.2rem;
            letter-spacing: 2px;
            opacity: 0.8;
            text-shadow: 0 0 5px var(--primary-color);
        }

        /* 图像展示区 */
        .showcase {
            border: 2px solid var(--primary-color);
            padding: 10px;
            background: var(--terminal-bg);
            box-shadow: 0 0 15px var(--primary-color);
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
        }

        /* 黑客绿色滤镜 */
        .showcase img {
            width: 100%;
            max-width: 100%;
            height: auto;
            display: block;
            filter: grayscale(100%) sepia(100%) hue-rotate(75deg) brightness(1.2) contrast(1.5);
            transition: all 0.5s ease;
        }
        
        .showcase:hover img {
            filter: grayscale(0%) sepia(0%) hue-rotate(0deg) brightness(1) contrast(1);
        }

        .showcase::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,255,0,0) 0%, rgba(0,255,0,0.15) 50%, rgba(0,255,0,0) 100%);
            animation: scan 3s infinite linear;
            pointer-events: none;
            z-index: 2;
        }

        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        /* 终端打字机区 */
        .terminal {
            background: var(--terminal-bg);
            border: 1px solid var(--primary-color);
            padding: 20px;
            margin-bottom: 40px;
            min-height: 220px;
            box-shadow: inset 0 0 20px rgba(0, 255, 0, 0.2);
            font-size: 1.1rem;
            line-height: 1.6;
            word-break: break-all;
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.2em;
            background-color: var(--primary-color);
            vertical-align: middle;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* 盒子特性网格 */
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .feature-card {
            border: 1px dashed var(--primary-color);
            padding: 20px;
            background: rgba(0, 20, 0, 0.4);
            transition: all 0.3s;
            cursor: crosshair;
            position: relative;
        }

        .feature-card:hover {
            background: var(--primary-color);
            color: var(--bg-color);
            box-shadow: 0 0 15px var(--primary-color);
            transform: translateY(-5px);
        }

        .feature-card::before {
            content: '>>';
            position: absolute;
            top: 20px;
            right: 20px;
            opacity: 0.3;
            font-weight: bold;
        }

        .feature-card:hover::before {
            opacity: 1;
            color: var(--bg-color);
        }

        .feature-card h3 {
            margin-bottom: 10px;
            font-size: 1.2rem;
            border-bottom: 1px solid var(--primary-color);
            padding-bottom: 5px;
            display: inline-block;
        }

        .feature-card:hover h3 {
            border-bottom: 1px solid var(--bg-color);
        }

        /* 下载按钮 */
        .download-wrapper {
            text-align: center;
            margin-bottom: 50px;
        }

        .download-btn {
            display: inline-block;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
            background: transparent;
            border: 2px solid var(--primary-color);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
        }

        .download-btn:hover {
            background: var(--primary-color);
            color: var(--bg-color);
            box-shadow: 0 0 30px var(--primary-color);
        }

        .download-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: 0.5s;
        }

        .download-btn:hover::before {
            left: 100%;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .glitch { font-size: 2.5rem; }
            .terminal { font-size: 1rem; min-height: 180px; }
            .download-btn { font-size: 1.2rem; padding: 12px 30px; width: 100%; }
            .features { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body class="crt">
    <!-- 动态矩阵雨背景 -->
    <canvas id="matrix-bg"></canvas>
    
    <div class="container">
        <header>
            <h1 class="glitch" data-text="PyKuai">PyKuai</h1>
            <p class="author">Developed by TuKuai</p>
        </header>

        <main>
            <!-- 软件截图展示区 -->
            <section class="showcase">
                <img src="imgs/main.png" alt="PyKuai Interface">
            </section>

            <!-- 打字机效果说明区 -->
            <section class="terminal">
                <div id="typewriter" style="display: inline;"></div><span class="cursor"></span>
            </section>

            <!-- 特性大集合网格 -->
            <section class="features">
                <div class="feature-card">
                    <h3>[01] 绝对泛用</h3>
                    <p>涵盖日常自动化、数据处理、系统管理的通用脚本库，即插即用，满足一切基础幻想。</p>
                </div>
                <div class="feature-card">
                    <h3>[02] 深度针对</h3>
                    <p>针对特定复杂场景的高阶脚本合集，提供手术刀般的精准打击，解决痛点。</p>
                </div>
                <div class="feature-card">
                    <h3>[03] 大集合生态</h3>
                    <p>不止于工具，这是一个不断进化的脚本盒子生态系统，高度整合，包罗万象。</p>
                </div>
                <div class="feature-card">
                    <h3>[04] 极简即极客</h3>
                    <p>摒弃臃肿的UI，回归黑绿终端的浪漫，用最高效的底层代码驱动世界。</p>
                </div>
            </section>

            <!-- 下载执行区 -->
            <section class="download-wrapper">
                <!-- 下载链接留空，由用户自行填入 href -->
                <a href="https://github.com/GallantTarry/pyside6-pykuai-app/releases/download/PyKuaiv1.2.0/PyKuai1.2.0.exe" class="download-btn">>> INITIALIZE_DOWNLOAD() <<</a>
            </section>
        </main>
    </div>

    <script>
        // Matrix 背景动画逻辑
        const canvas = document.getElementById('matrix-bg');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレゲゼデベペオォコソトノホモヨョロゴゾドボポヴッン';
        const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const nums = '0123456789';
        const alphabet = katakana + latin + nums;
        
        const fontSize = 16;
        let columns = canvas.width / fontSize;
        
        let rainDrops = [];
        for (let x = 0; x < columns; x++) {
            rainDrops[x] = 1;
        }
        
        const draw = () => {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px monospace';
            
            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
                
                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        };
        setInterval(draw, 30);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            columns = canvas.width / fontSize;
            rainDrops = [];
            for (let x = 0; x < columns; x++) {
                rainDrops[x] = 1;
            }
        });

        // 终端打字机效果逻辑
        const textToType = `root@TuKuai:~# ./pykuai_init.sh
> 正在初始化 PyKuai 环境... [OK]
> 正在加载泛用性脚本库... [OK]
> 正在挂载针对性模块... [OK]
> 
> 欢迎来到 PyKuai - 终极脚本盒子。
> 这是将大集合理念与复古黑绿极客美学发展到极致的产物。
> 泛用与针对，一盒打尽。
> 准备好掌控一切了吗？
> 
> Waiting for user action...`;

        const typeWriterElement = document.getElementById('typewriter');
        let i = 0;

        function typeWriter() {
            if (i < textToType.length) {
                if (textToType.charAt(i) === '\n') {
                    typeWriterElement.innerHTML += '<br>';
                } else {
                    typeWriterElement.innerHTML += textToType.charAt(i);
                }
                i++;
                setTimeout(typeWriter, Math.random() * 40 + 20); 
            }
        }

        // 延迟1秒启动打字机
        setTimeout(typeWriter, 1000);
    </script>
</body>
</html>
