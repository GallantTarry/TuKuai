<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KuaiDrive | 挂载磁盘与文件传输七巧板</title>
    <!-- 精准挂载像素玫瑰 ICO -->
    <link rel="icon" href="imgs/KuaiDrive.ico" type="image/x-icon">
    <style>
        /* CSS 变量：专属红金调色板 */
        :root {
            --primary: #D4AF37; /* 暗金 */
            --accent: #C0392B; /* 蔷薇红 */
            --bg-color: #16151A; /* 极暗紫黑底色 */
            --glass-bg: rgba(22, 21, 26, 0.6);
            --glass-border: rgba(212, 175, 55, 0.2);
            --glow-color: rgba(192, 57, 43, 0.5);
            --glow-gold: rgba(212, 175, 55, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "-apple-system", "Microsoft YaHei", "Segoe UI", sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image:
                    radial-gradient(circle at 15% 50%, rgba(212, 175, 55, 0.08), transparent 25%),
                    radial-gradient(circle at 85% 30%, rgba(192, 57, 43, 0.08), transparent 25%);
            color: #E4E4E7;
            line-height: 1.6;
            overflow: hidden; /* 没有下方内容了，直接锁定屏幕防止滚动 */
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 画布底层：花瓣飘落引擎 */
        #petal-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        /* 星云背景 */
        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: -2;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.3;
            animation: drift 100s linear infinite;
        }

        @keyframes drift {
            from { background-position: 0 0; }
            to { background-position: -10000px 5000px; }
        }

        /* 导航栏 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: rgba(22, 21, 26, 0.8);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border);
            position: relative;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .logo-container:hover { transform: scale(1.05); }

        .logo-container img {
            width: 40px; height: 40px;
            border-radius: 8px;
            box-shadow: 0 0 15px var(--glow-color);
            transition: transform 0.3s ease;
        }

        .logo-container img.playing {
            animation: heartbeat 1.5s ease-in-out infinite;
            box-shadow: 0 0 25px var(--accent);
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .logo-text, .hero h1 {
            font-weight: 800;
            background: linear-gradient(270deg, var(--primary), var(--accent), #E5C07B, var(--primary));
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-shift 5s ease infinite;
        }

        .logo-text { font-size: 1.5rem; letter-spacing: 1px; }

        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .buy-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: #fff;
            padding: 10px 24px;
            border-radius: 20px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            backdrop-filter: blur(10px);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .buy-btn:hover {
            background: rgba(192, 57, 43, 0.3);
            border-color: var(--primary);
            box-shadow: 0 0 25px var(--glow-gold);
            transform: translateY(-2px);
        }

        .price-tag {
            background: linear-gradient(135deg, var(--accent), var(--primary));
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            color: #000;
            font-weight: bold;
            box-shadow: inset 0 0 5px rgba(255,255,255,0.4);
        }

        /* 英雄区域 (居中占满剩余空间) */
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            position: relative;
        }

        .hero h1.cosmic-title {
            font-size: 5rem;
            margin-bottom: 20px;
            letter-spacing: 6px;
            text-shadow: 0 0 20px rgba(192, 57, 43, 0.5), 0 0 40px rgba(212, 175, 55, 0.3);
        }

        .hero p.cosmic-subtitle {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.25rem;
            color: var(--primary);
            letter-spacing: 6px;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            margin: 0 auto 50px auto;
        }

        .hero-img-container {
            position: relative;
            width: 180px; height: 180px;
            margin: 0 auto 40px auto;
            animation: float 6s ease-in-out infinite;
        }

        .hero-img-container::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 110%; height: 110%;
            border-radius: 20%;
            box-shadow: 0 0 50px var(--accent);
            z-index: -1;
            opacity: 0.6;
            animation: pulse-glow 4s ease-in-out infinite alternate;
        }

        .hero-img-container img {
            width: 100%; height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8));
            border-radius: 12px;
        }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-15px) scale(1.02); }
            100% { transform: translateY(0px) scale(1); }
        }

        @keyframes pulse-glow {
            from { box-shadow: 0 0 30px var(--accent); opacity: 0.4; }
            to { box-shadow: 0 0 80px var(--primary); opacity: 0.8; }
        }

        /* 开发中敬请期待按钮 */
        .lock-btn {
            background: rgba(10, 10, 10, 0.8);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 14px 40px;
            border-radius: 25px;
            font-size: 1.15rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: default;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
            transition: all 0.3s ease;
        }

        .lock-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 25px rgba(192, 57, 43, 0.4);
        }

        /* 底部 */
        footer {
            text-align: center;
            padding: 20px 20px 40px;
            background: transparent;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            header { padding: 15px 20px; }
            .logo-text { font-size: 1.2rem; }
            .buy-btn { padding: 8px 16px; font-size: 0.95rem; }
            .hero h1.cosmic-title { font-size: 3rem; letter-spacing: 4px; }
            .hero p.cosmic-subtitle { font-size: 1rem; letter-spacing: 3px; margin-bottom: 35px; }
            .hero-img-container { width: 140px; height: 140px; margin-bottom: 30px; }
        }
    </style>
</head>
<body>

<div class="stars"></div>
<!-- 玫瑰花瓣物理引擎 -->
<canvas id="petal-canvas"></canvas>

<header>
    <div class="logo-container" id="music-toggle">
        <img src="imgs/KuaiDrive.ico" alt="KuaiDrive Logo" id="music-disk">
        <div class="logo-text">BGM</div>
        <audio id="bg-music" src="music/西西里舞曲.mp3" loop></audio>
    </div>

    <a href="docs/KuaiDrive使用说明书.md" download="KuaiDrive使用说明书.md" class="buy-btn">
        获取说明
        <span class="price-tag">下载</span>
    </a>
</header>

<section class="hero">
    <div class="hero-img-container">
        <img src="imgs/KuaiDrive.ico" alt="KuaiDrive 核心">
    </div>
    <h1 class="cosmic-title">KUAIDRIVE</h1>
    <p class="cosmic-subtitle">安全 · 简洁 · 迅速 · P2P</p>

    <div class="lock-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        软件开发中，敬请期待
    </div>
</section>

<footer>
    <p style="color: var(--primary); font-size: 0.95rem; letter-spacing: 2px; opacity: 0.8;">
        &copy; 2026 Created by 土块. The Mech is Awakening.
    </p>
</footer>

<script>
    // --- 1. 音乐播放器 ---
    const musicToggle = document.getElementById('music-toggle');
    const bgMusic = document.getElementById('bg-music');
    const musicDisk = document.getElementById('music-disk');

    musicToggle.addEventListener('click', () => {
        if (bgMusic.paused) {
            bgMusic.play();
            musicDisk.classList.add('playing');
        } else {
            bgMusic.pause();
            musicDisk.classList.remove('playing');
        }
    });

    // --- 2. 原生花瓣物理引擎 ---
    const canvas = document.getElementById('petal-canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let petals = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    // 提取自像素玫瑰的配色
    const petalColors = ['#C0392B', '#D9534F', '#8B0000', '#D4AF37', '#8B6D55'];

    class Petal {
        constructor() {
            this.reset();
            this.y = Math.random() * height;
        }

        reset() {
            this.x = Math.random() * width;
            this.y = -Math.random() * 200 - 50;
            this.size = Math.random() * 10 + 5;
            this.speedY = Math.random() * 1.2 + 0.5;
            this.speedX = Math.random() * 1 - 0.5;
            this.angle = Math.random() * Math.PI * 2;
            this.spin = Math.random() * 0.04 - 0.02;
            this.sway = Math.random() * 0.02;
            this.swayOffset = Math.random() * Math.PI * 2;
            this.color = petalColors[Math.floor(Math.random() * petalColors.length)];
        }

        update() {
            this.y += this.speedY;
            this.x += this.speedX + Math.sin(this.y * this.sway + this.swayOffset) * 1.5;
            this.angle += this.spin;

            if (this.y > height + this.size) {
                this.reset();
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(this.size * 1.5, this.size * 0.5, this.size, this.size * 1.5);
            ctx.quadraticCurveTo(this.size * 0.2, this.size * 1.2, 0, 0);

            ctx.fillStyle = this.color;
            ctx.globalAlpha = 0.65;
            ctx.fill();

            ctx.restore();
        }
    }

    const petalCount = window.innerWidth < 768 ? 30 : 60;
    for (let i = 0; i < petalCount; i++) {
        petals.push(new Petal());
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        for (let petal of petals) {
            petal.update();
            petal.draw();
        }
        requestAnimationFrame(animate);
    }

    animate();
</script>
</body>
</html>
