<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>TuKuaiStudio | 土块工坊主控制台</title>
    <link rel="icon" href="imgs/TuKuaiStudio.ico" type="image/x-icon">

    <style>
        /* ==========================================================================
           【主控制台设计系统】 极简深空 · 全屏控制台布局 (PC + Mobile 全端适配)
           ========================================================================== */
        :root {
            --bg-abyss: #04060a;
            --bar-bg: rgba(9, 13, 24, 0.88);
            --bar-border: rgba(255, 255, 255, 0.08);
            --accent-gold: #facc15;
            --accent-cyan: #38bdf8;
            --accent-emerald: #10b981;
            --text-primary: #ffffff;
            --text-muted: #94a3b8;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --navbar-height: 58px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--bg-abyss);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .console-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding-top: env(safe-area-inset-top, 0px);
        }

        /* ================= 顶部控制台导航栏 (Top Console Bar) ================= */
        .console-navbar {
            height: var(--navbar-height);
            min-height: var(--navbar-height);
            background: var(--bar-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 0 max(20px, env(safe-area-inset-right, 20px)) 0 max(20px, env(safe-area-inset-left, 20px));
            z-index: 50;
            user-select: none;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .brand-logo {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            border: 1px solid rgba(250, 204, 21, 0.4);
            padding: 2px;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 12px rgba(250, 204, 21, 0.2);
            object-fit: cover;
            flex-shrink: 0;
        }

        .brand-meta {
            display: flex;
            flex-direction: column;
        }

        .brand-title {
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #ffffff 40%, var(--accent-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
            white-space: nowrap;
        }

        .brand-sub {
            font-size: 0.72rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-emerald);
            box-shadow: 0 0 6px var(--accent-emerald);
            flex-shrink: 0;
        }

        .nav-right-group {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
            justify-content: flex-end;
        }

        .console-tabs {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 4px;
            border-radius: 12px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            max-width: 100%;
        }

        .console-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.84rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 7px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .tab-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-btn.active {
            background: rgba(250, 204, 21, 0.15);
            border-color: rgba(250, 204, 21, 0.35);
            color: var(--accent-gold);
            box-shadow: 0 0 12px rgba(250, 204, 21, 0.15);
        }

        .tab-btn.disabled {
            opacity: 0.38;
            cursor: not-allowed;
            pointer-events: none;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
            padding: 7px 12px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .action-btn:hover {
            color: #ffffff;
            border-color: rgba(250, 204, 21, 0.35);
            background: rgba(250, 204, 21, 0.1);
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        /* ================= 核心视窗：嵌套的工坊模块 (Iframe Viewport) ================= */
        .console-viewport {
            flex: 1;
            width: 100%;
            height: calc(100% - var(--navbar-height));
            position: relative;
            background: #05070f;
            overflow: hidden;
            -webkit-overflow-scrolling: touch;
        }

        .viewport-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        #console-toast {
            position: fixed;
            bottom: max(24px, calc(env(safe-area-inset-bottom, 16px) + 12px));
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #10b981;
            color: #ffffff;
            padding: 8px 20px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            z-index: 9999;
            white-space: nowrap;
        }

        #console-toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* ================= 移动端深度紧凑适配 ================= */
        @media (max-width: 768px) {
            :root {
                --navbar-height: 52px;
            }

            .console-navbar {
                padding: 0 10px;
                gap: 8px;
            }

            .brand-logo {
                width: 30px;
                height: 30px;
                border-radius: 8px;
            }

            .brand-title {
                font-size: 0.92rem;
            }

            .brand-sub {
                display: none;
            }

            .console-tabs {
                padding: 3px;
                border-radius: 10px;
                gap: 4px;
            }

            .tab-btn {
                padding: 5px 10px;
                font-size: 0.76rem;
                border-radius: 7px;
                gap: 5px;
            }

            .tab-btn svg {
                width: 13px;
                height: 13px;
            }

            .action-btn {
                padding: 7px;
                border-radius: 8px;
            }

            .action-btn span {
                display: none;
            }
        }

        @media (max-width: 420px) {
            .brand-title {
                font-size: 0.82rem;
            }
            .tab-btn.disabled {
                display: none;
            }
        }
    </style>
</head>
<body>

<div class="console-wrapper" id="console-root">

    <!-- 顶部工坊主控制台操作栏 -->
    <header class="console-navbar">
        <!-- 1. 左侧工坊 Logo 与状态 -->
        <div class="brand-section">
            <img src="imgs/TuKuaiStudio.ico" alt="TuKuaiStudio Logo" class="brand-logo">
            <div class="brand-meta">
                <span class="brand-title">TuKuaiStudio</span>
                <span class="brand-sub">
                    <span class="status-dot"></span>
                    土块工坊控制台
                </span>
            </div>
        </div>

        <!-- 2. 右侧功能跳转选项卡与快捷刷新 -->
        <div class="nav-right-group">
            <nav class="console-tabs" aria-label="工坊功能导航">
                <!-- 工位 1：TuKuaiUI.html (Web 影音组件) -->
                <button class="tab-btn active" id="tab-tukuaiui" onclick="switchConsoleModule('./TuKuaiUI/TuKuaiUI.html', this)">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polygon points="10 8 16 12 10 16 10 8"></polygon></svg>
                    TuKuai-UI 影音组件
                </button>

                <!-- 工位 2：TuKuaiGUI.html (Java Swing 毛玻璃组件库) -->
                <button class="tab-btn" id="tab-tukuaigui" onclick="switchConsoleModule('./TuKuaiGUI/TuKuaiGUI.html', this)">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                    TuKuai-GUI 桌面组件
                </button>

                <!-- 未来扩展槽位占位 -->
                <button class="tab-btn disabled" title="更多自研工位正在孵化中...">
                    <span>✦</span>
                    待接入功能...
                </button>
            </nav>

            <button class="action-btn" onclick="reloadConsoleIframe()" title="重新加载当前工位">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
                <span>刷新</span>
            </button>
        </div>
    </header>

    <!-- 核心视窗：业内嵌套跳转目标 (默认加载 TuKuaiUI.html) -->
    <main class="console-viewport">
        <iframe
                id="console-frame"
                class="viewport-iframe"
                src="./TuKuaiUI/TuKuaiUI.html"
                title="TuKuaiStudio 工坊视窗">
        </iframe>
    </main>

</div>

<!-- 吐司通知条 -->
<div id="console-toast">已刷新当前工位！</div>

<script>
    // 业内模块切换调度器
    function switchConsoleModule(targetUrl, tabElement) {
        const frame = document.getElementById('console-frame');
        if (frame && frame.getAttribute('src') !== targetUrl) {
            frame.src = targetUrl;
        }

        // 切换激活高亮
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        if (tabElement) {
            tabElement.classList.add('active');
        }
    }

    // 重载视窗
    function reloadConsoleIframe() {
        const frame = document.getElementById('console-frame');
        if (frame) {
            frame.src = frame.src;
            showConsoleToast('已重新加载工坊视窗！');
        }
    }

    // 吐司提示
    let toastTimer = null;
    function showConsoleToast(msg) {
        const toast = document.getElementById('console-toast');
        toast.innerText = msg;
        toast.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            toast.classList.remove('show');
        }, 2000);
    }
</script>

</body>
</html>
