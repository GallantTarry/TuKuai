<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TuKuaiStudio | 土块工坊主控制台</title>
    <link rel="icon" href="imgs/TuKuaiStudio.ico" type="image/x-icon">

    <style>
        /* ==========================================================================
           【主控制台设计系统】 极简深空 · 全屏控制台布局
           ========================================================================== */
        :root {
            --bg-abyss: #04060a;
            --bar-bg: rgba(9, 13, 24, 0.88);
            --bar-border: rgba(255, 255, 255, 0.08);
            --accent-gold: #facc15;
            --accent-cyan: #38bdf8;
            --accent-emerald: #10b981;
            --text-primary: #ffffff;
            --text-muted: #94a3b8;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-abyss);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* 控制台整体纵向 Flex 布局 */
        .console-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        /* ================= 顶部控制台导航栏 (Top Console Bar) ================= */
        .console-navbar {
            height: 58px;
            min-height: 58px;
            background: var(--bar-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--bar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 50;
            user-select: none;
        }

        /* 左侧品牌与工坊标识 */
        .brand-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            border: 1px solid rgba(250, 204, 21, 0.4);
            padding: 2px;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 12px rgba(250, 204, 21, 0.2);
            object-fit: cover;
        }

        .brand-meta {
            display: flex;
            flex-direction: column;
        }

        .brand-title {
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #ffffff 40%, var(--accent-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
        }

        .brand-sub {
            font-size: 0.72rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-emerald);
            box-shadow: 0 0 6px var(--accent-emerald);
        }

        /* 中间功能跳转选项卡 (工坊功能切换区) */
        .console-tabs {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 4px;
            border-radius: 12px;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 0.84rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
        }

        /* 激活状态 */
        .tab-btn.active {
            background: rgba(250, 204, 21, 0.15);
            border-color: rgba(250, 204, 21, 0.35);
            color: var(--accent-gold);
            box-shadow: 0 0 12px rgba(250, 204, 21, 0.15);
        }

        .tab-btn.disabled {
            opacity: 0.38;
            cursor: not-allowed;
            pointer-events: none;
        }


        /* ================= 核心视窗：嵌套的工坊模块 (Iframe Viewport) ================= */
        .console-viewport {
            flex: 1;
            width: 100%;
            height: calc(100% - 58px);
            position: relative;
            background: #05070f;
        }

        .viewport-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* 吐司提示条 */
        #console-toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #10b981;
            color: #ffffff;
            padding: 8px 20px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            z-index: 9999;
        }

        #console-toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* 移动端紧凑适配 */
        @media (max-width: 768px) {
            .console-navbar { padding: 0 12px; }
            .brand-sub { display: none; }
            .tab-btn { padding: 6px 10px; font-size: 0.78rem; }
            .action-btn span { display: none; }
            .action-btn { padding: 6px 10px; }
        }
    </style>
</head>
<body>

<div class="console-wrapper" id="console-root">

    <!-- 顶部工坊主控制台操作栏 -->
    <header class="console-navbar">
        <!-- 1. 左侧工坊 Logo 与状态 -->
        <div class="brand-section">
            <img src="imgs/TuKuaiStudio.ico" alt="TuKuaiStudio Logo" class="brand-logo">
            <div class="brand-meta">
                <span class="brand-title">TuKuaiStudio</span>
                <span class="brand-sub">
                    <span class="status-dot"></span>
                    土块工坊控制台
                </span>
            </div>
        </div>

        <!-- 2. 业内功能跳转选项卡 (当前仅有一个跳转：TuKuaiUI.html) -->
        <nav class="console-tabs" aria-label="工坊功能导航">
            <!-- 当前唯一功能项：TuKuaiUI.html -->
            <button class="tab-btn active" id="tab-tukuaiui" onclick="switchConsoleModule('./TuKuaiUI/TuKuaiUI.html', this)">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polygon points="10 8 16 12 10 16 10 8"></polygon></svg>
                TuKuai-UI 影音组件
            </button>

            <!-- 未来扩展槽位占位 -->
            <button class="tab-btn disabled" title="更多自研工位正在孵化中...">
                <span>✦</span>
                待接入功能...
            </button>
        </nav>
    </header>

    <!-- 核心视窗：业内嵌套跳转目标 (默认加载 TuKuaiUI.html) -->
    <main class="console-viewport">
        <iframe 
            id="console-frame" 
            class="viewport-iframe" 
            src="./TuKuaiUI/TuKuaiUI.html" 
            title="TuKuaiUI 影音组件工坊">
        </iframe>
    </main>

</div>

<!-- 吐司通知条 -->
<div id="console-toast">已刷新当前工位！</div>

<script>
    // 业内模块切换调度器（目前支持 TuKuaiUI.html，未来可平滑增加新功能模块）
    function switchConsoleModule(targetUrl, tabElement) {
        const frame = document.getElementById('console-frame');
        if (frame && frame.getAttribute('src') !== targetUrl) {
            frame.src = targetUrl;
        }

        // 切换激活高亮
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        if (tabElement) {
            tabElement.classList.add('active');
        }
    }

    // 重载视窗
    function reloadConsoleIframe() {
        const frame = document.getElementById('console-frame');
        if (frame) {
            frame.src = frame.src;
            showConsoleToast('已重新加载工坊视窗！');
        }
    }

    // 吐司提示
    let toastTimer = null;
    function showConsoleToast(msg) {
        const toast = document.getElementById('console-toast');
        toast.innerText = msg;
        toast.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            toast.classList.remove('show');
        }, 2000);
    }
</script>

</body>
</html>
