<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuKuai-GUI · 敬请期待</title>
    <link rel="icon" href="../imgs/TuKuaiStudio.ico" type="image/x-icon">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0b0e;
            background-image: 
                radial-gradient(at 0% 0%, rgba(250, 204, 21, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.08) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(16, 185, 129, 0.05) 0px, transparent 60%);
            color: #f4f4f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        .notice-card {
            max-width: 520px;
            width: 100%;
            background: rgba(20, 20, 26, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 48px 32px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .icon-wrap {
            width: 72px;
            height: 72px;
            margin: 0 auto 24px;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(250, 204, 21, 0.15), rgba(56, 189, 248, 0.15));
            border: 1px solid rgba(250, 204, 21, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 0 25px rgba(250, 204, 21, 0.15);
        }

        .badge {
            display: inline-block;
            background: rgba(250, 204, 21, 0.12);
            border: 1px solid rgba(250, 204, 21, 0.3);
            color: #facc15;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 999px;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 1.65rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 14px;
            letter-spacing: -0.5px;
        }

        p {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.7;
        }
    </style>
</head>
<body>

    <div class="notice-card">
        <div class="icon-wrap">🚧</div>
        <div class="badge">DEVELOPMENT PAUSED</div>
        <h1>等 ToolKit 完结再发布</h1>
        <p>TuKuai-GUI 组件库暂未开放，正在全力攻坚 ToolKit 核心基础库，待完结后统一部署上线，敬请期待！</p>
    </div>

</body>
</html>
