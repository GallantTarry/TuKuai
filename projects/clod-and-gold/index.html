<head>

    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "VideoGame",
            "name": "Clod＆Gold",
            "alternateName": ["Clod&Gold", "clod-and-gold", "clodandgold", "土块与金苹果"],
            "applicationCategory": "Game",
            "url": "https://xn--udsye.art/projects/clod-and-gold/",
            "image": "https://xn--udsye.art/projects/clod-and-gold/imgs/music-cover.png",
            "description": "Clod＆Gold（土块与金苹果）是 TuKuai 创作的像素风独立游戏与互动作品。",
            "author": {
                "@type": "Person",
                "name": "TuKuai (土块)"
            }
        }
    </script>
    <style>
        :root {
            /* 原图提取的经典纯色温暖米黄背景 */
            --bg-color: #FBF2D8;
            --apple-gold: #F5BB0F;
            --apple-gold-hover: #F8C828;
            --apple-dark: #3C2B06;
            --apple-brown: #553D09;
            --text-secondary: #745C33;
            --border-soft: rgba(85, 61, 9, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "-apple-system", BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--apple-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: var(--apple-gold) var(--bg-color);
        }

        /* 全局简朴温润滚动条 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(245, 187, 15, 0.55);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--apple-gold);
        }

        /* ==========================================================================
           【顶部导航栏】 (仿照 ToolKit 按钮排版)
           ========================================================================== */
        header.nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: rgba(251, 242, 216, 0.95);
            border-bottom: 1px solid var(--border-soft);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .logo-container:hover {
            transform: scale(1.04);
        }

        .logo-container img {
            width: 40px;
            height: 40px;
            border-radius: 25%;
            object-fit: cover;
            border: 1.5px solid var(--apple-brown);
            background: #fff;
        }

        .logo-container img.playing {
            animation: disk-spin 10s linear infinite;
        }

        @keyframes disk-spin {
            100% {
                transform: rotate(360deg);
            }
        }

        .logo-text {
            font-weight: 800;
            font-size: 1.4rem;
            color: var(--apple-brown);
            letter-spacing: 2px;
        }

        /* 获取说明按钮 (ToolKit 同款结构) */
        .buy-btn {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid var(--border-soft);
            color: var(--apple-brown);
            padding: 9px 22px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.25s ease;
        }

        .buy-btn:hover {
            background: #ffffff;
            border-color: var(--apple-gold);
            transform: translateY(-2px);
        }

        .price-tag {
            background: var(--apple-gold);
            color: var(--apple-dark);
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        /* ==========================================================================
           【核心主体区】 纯粹质朴，像素金苹果与拯救色彩
           ========================================================================== */
        .main-layout {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px 50px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        /* 透明背景金苹果展示 */
        .hero-img-box {
            width: 200px;
            height: 200px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-img-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated; /* 呈现精致纯正的像素艺术 */
        }

        .title {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: var(--apple-dark);
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--text-secondary);
            letter-spacing: 3px;
            font-weight: 500;
            margin-bottom: 30px;
        }

        /* 游戏主题理念标签 */
        .theme-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(85, 61, 9, 0.06);
            border: 1px dashed rgba(85, 61, 9, 0.25);
            padding: 8px 22px;
            border-radius: 20px;
            font-size: 0.95rem;
            color: var(--apple-brown);
            margin-bottom: 28px;
            letter-spacing: 1px;
        }

        /* 下载按钮：不可点击、无加速 */
        .btn-download-disabled {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 36px;
            background: rgba(85, 61, 9, 0.08);
            border: 1px solid rgba(85, 61, 9, 0.18);
            color: rgba(60, 43, 6, 0.45);
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 12px;
            letter-spacing: 1px;
            cursor: not-allowed;
            user-select: none;
            pointer-events: none; /* 彻底禁用点击 */
        }

        footer {
            padding: 25px 20px;
            text-align: center;
            color: rgba(85, 61, 9, 0.45);
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            header.nav-header { padding: 15px 20px; }
            .logo-text { font-size: 1.15rem; }
            .logo-container img { width: 32px; height: 32px; }
            .buy-btn { padding: 7px 16px; font-size: 0.85rem; }
            .hero-img-box { width: 150px; height: 150px; }
            .title { font-size: 2.3rem; letter-spacing: 2px; }
            .subtitle { font-size: 0.95rem; letter-spacing: 2px; }
            .btn-download-disabled { padding: 12px 24px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

<!-- 顶部导航栏 (ToolKit 按钮排版规范) -->
<header class="nav-header">
    <div class="logo-container" id="music-toggle" title="播放/暂停音乐">
        <img src="imgs/favicon-192x192.png" alt="Music Disk" id="music-disk">
        <div class="logo-text">BGM</div>
        <audio id="bg-music" src="music/clod-and-gold.ogg" loop preload="metadata"></audio>
    </div>

    <a href="docs/manual.md" download="Clod＆Gold操作说明.md" class="buy-btn">
        获取说明
        <span class="price-tag">下载</span>
    </a>
</header>

<!-- 主体内容 -->
<main class="main-layout">
    <!-- 透明背景的金苹果图 -->
    <div class="hero-img-box">
        <img src="imgs/clod-and-gold-nobg.png" alt="Clod＆Gold 土块与金苹果">
    </div>

    <h1 class="title">CLOD＆GOLD</h1>
    <p class="subtitle">土块与金苹果 · 拯救色彩，重焕世界</p>

    <!-- 游戏主题与开发状态 -->
    <div class="theme-badge">
        <span>🌱 游戏开发中 · 敬请期待</span>
    </div>

    <!-- 不可点击、不加速的下载按钮 -->
    <div>
        <div class="btn-download-disabled" title="游戏开发中，暂未开放下载">
            <svg style="margin-right:10px;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            下载暂未开放 (ClodAndGold_Setup.exe)
        </div>
    </div>
</main>

<footer>
    <p style="color: #64748B; font-size: 0.95rem; letter-spacing: 1px;">
        <a href="https://gallanttarry.github.io/TuKuai/" target="_blank"
           style="color: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: 5px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>

        </a>
        &copy; 2026 Created by 土块. All rights reserved.
    </p>
</footer>

<script src="../shared/media-session.js"></script>
<script>

        cover: 'imgs/music-cover.png',
        smallCover: 'imgs/apple-touch-icon.png'
    });
</script>
</body>
</html>
