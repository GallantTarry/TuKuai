<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EmulatorJS Core</title>
    <link href="/favicon.ico" rel="icon" sizes="32x32">
    <link href="/assets/images/favicon/favicon-96x96.png" rel="icon" type="image/png" sizes="96x96">
    <link href="/assets/images/favicon/favicon.svg" rel="icon" type="image/svg+xml" sizes="any">
    <link href="/assets/images/favicon/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180">
    <style>
        @font-face {
            font-family: 'Silkscreen';
            src: url('../assets/fonts/Silkscreen-Regular.ttf') format('truetype');
            font-weight: 400;
            font-display: swap;
        }
        @font-face {
            font-family: 'Silkscreen';
            src: url('../assets/fonts/Silkscreen-Bold.ttf') format('truetype');
            font-weight: 700;
            font-display: swap;
        }
        @font-face {
            font-family: 'ChinesePixel';
            src: url('../assets/fonts/zpix.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Silkscreen', 'ChinesePixel', monospace;
            overscroll-behavior: none;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }
        #game {
            width: 100%;
            height: 100%;
            /* 必须加回这一行！禁止浏览器拦截触摸，直接穿透给游戏画布 */
            touch-action: none !important;
        }

        /* ================= 存档恢复弹窗与果冻提示胶囊（桌面 / 手机自适应） ================= */
        .tk-resume-mask {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.68);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            font-family: 'Silkscreen', 'ChinesePixel', monospace;
            animation: tkMaskFadeIn 0.22s ease-out both;
        }

        .tk-resume-card {
            width: 100%;
            max-width: 288px;
            box-sizing: border-box;
            background: rgba(15, 20, 30, 0.92);
            color: #e2e8f0;
            border: 1px solid rgba(74, 222, 128, 0.38);
            border-top-color: rgba(134, 239, 172, 0.55);
            border-radius: 20px;
            padding: 20px 18px 18px;
            text-align: center;
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.82), 0 0 24px rgba(74, 222, 128, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            animation: tkJellyCardIn 0.52s cubic-bezier(0.22, 1, 0.36, 1) both;
            transform-origin: 50% 55%;
        }

        .tk-resume-title {
            font-size: 16px;
            font-weight: 700;
            color: #4ade80;
            letter-spacing: 1.5px;
            text-shadow: 0 0 12px rgba(74, 222, 128, 0.35);
        }

        .tk-resume-time {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 6px;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }

        .tk-resume-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .tk-resume-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            height: 44px;
            padding: 0 14px;
            box-sizing: border-box;
            border-radius: 12px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1.5px;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
        }

        .tk-resume-btn--primary {
            background: #4ade80;
            color: #052e16;
            border: none;
            box-shadow: 0 4px 16px rgba(74, 222, 128, 0.28);
        }

        .tk-resume-btn--primary:hover {
            background: #6ee79a;
            transform: translateY(-1.5px) scale(1.015);
            box-shadow: 0 6px 22px rgba(74, 222, 128, 0.42);
        }

        .tk-resume-btn--secondary {
            background: rgba(255, 255, 255, 0.04);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.22);
        }

        .tk-resume-btn--secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.4);
            color: #ffffff;
            transform: translateY(-1.5px) scale(1.015);
        }

        .tk-resume-btn:active {
            transform: scale(0.96);
        }

        /* 底部果冻回弹提示胶囊 */
        .tk-jelly-toast {
            position: fixed;
            left: 50%;
            bottom: calc(clamp(26px, 6.5vh, 44px) + env(safe-area-inset-bottom, 0px));
            z-index: 99998;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            max-width: calc(100vw - 32px);
            padding: 8px 16px;
            box-sizing: border-box;
            border-radius: 999px;
            background: rgba(12, 18, 28, 0.88);
            backdrop-filter: blur(14px) saturate(180%);
            -webkit-backdrop-filter: blur(14px) saturate(180%);
            border: 1px solid rgba(74, 222, 128, 0.48);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6), 0 0 18px rgba(74, 222, 128, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.14);
            color: #4ade80;
            font-family: 'Silkscreen', 'ChinesePixel', monospace;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            pointer-events: none;
            transform-origin: 50% 100%;
            will-change: transform, opacity;
            animation: tkJellyToastIn 0.68s both;
        }

        .tk-jelly-toast--warn {
            border-color: rgba(250, 204, 21, 0.5);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6), 0 0 18px rgba(250, 204, 21, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            color: #fde047;
        }

        .tk-jelly-toast.is-leaving {
            animation: tkJellyToastOut 0.34s cubic-bezier(0.4, 0, 1, 1) forwards;
        }

        .tk-jelly-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 8px #4ade80;
            flex-shrink: 0;
        }

        .tk-jelly-toast--warn .tk-jelly-dot {
            background: #facc15;
            box-shadow: 0 0 8px #facc15;
        }

        @media (min-width: 640px) {
            .tk-resume-card {
                max-width: 308px;
                padding: 22px 22px 20px;
            }
            .tk-resume-title {
                font-size: 17px;
            }
            .tk-resume-btn {
                height: 46px;
                font-size: 15px;
            }
            .tk-jelly-toast {
                bottom: clamp(24px, 5vh, 38px);
                padding: 9px 20px;
                font-size: 13px;
            }
        }

        @keyframes tkMaskFadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        @keyframes tkJellyCardIn {
            0%   { opacity: 0; transform: scale(0.86, 0.84) translateY(16px); }
            35%  { opacity: 1; transform: scale(1.03, 0.97) translateY(-3px); }
            62%  { transform: scale(0.99, 1.015) translateY(1px); }
            100% { opacity: 1; transform: scale(1, 1) translateY(0); }
        }

        @keyframes tkJellyToastIn {
            0%   { opacity: 0; transform: translate(-50%, 30px) scale(0.72, 0.78); }
            28%  { opacity: 1; transform: translate(-50%, -8px) scale(0.93, 1.10); }
            48%  { transform: translate(-50%, 3px) scale(1.06, 0.93); }
            66%  { transform: translate(-50%, -2px) scale(0.985, 1.025); }
            82%  { transform: translate(-50%, 0.5px) scale(1.01, 0.992); }
            100% { opacity: 1; transform: translate(-50%, 0) scale(1, 1); }
        }

        @keyframes tkJellyToastOut {
            0%   { opacity: 1; transform: translate(-50%, 0) scale(1, 1); }
            28%  { opacity: 1; transform: translate(-50%, -3px) scale(1.03, 0.96); }
            100% { opacity: 0; transform: translate(-50%, 16px) scale(0.85, 0.88); }
        }

        @media (prefers-reduced-motion: reduce) {
            .tk-resume-mask,
            .tk-resume-card,
            .tk-jelly-toast,
            .tk-jelly-toast.is-leaving {
                animation: none;
            }
            .tk-jelly-toast {
                transform: translate(-50%, 0);
            }
        }

    </style>
</head>
<body>

<div id="game"></div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const romFile = urlParams.get('rom');
    const coreParam = urlParams.get('core');

    if (!romFile) {
        document.body.innerHTML = `
            <div style="text-align:center; color: #4ade80; line-height: 2;">
                <div style="font-size: 3rem; margin-bottom: 1rem;">⚠️</div>
                <h3>SYSTEM ERROR: NO ROM DETECTED</h3>
                <p style="color: #64748b; font-size: 12px;">Missing "?rom=filename" parameter in URL.</p>
            </div>
        `;
    } else {
        let core = coreParam || 'gba';
        if (!coreParam) {
            const ext = romFile.split('.').pop().toLowerCase();
            if (ext === 'sfc' || ext === 'smc') core = 'snes';
            else if (ext === 'nes') core = 'nes';
            else if (ext === 'gb' || ext === 'gbc') core = 'gb';
            // 仅仅识别 NDS 扩展名
            else if (ext === 'nds') core = 'desmume';
        }

        // =========================================================================
        // 为每个游戏计算独立的唯一 ID，防止存档串区
        // =========================================================================
        let romHash = 0;
        for (let i = 0; i < romFile.length; i++) {
            romHash = (romHash << 5) - romHash + romFile.charCodeAt(i);
            romHash |= 0;
        }
        window.EJS_gameID = Math.abs(romHash);

        // =========================================================================
        // 极简纯净配置区（剥离所有自动化存档与强制数据库设定）
        // =========================================================================
        window.EJS_player = '#game';
        window.EJS_core = core;
        window.EJS_gameName = romFile;
        window.EJS_language = 'zh-CN';
        window.EJS_color = '#4ade80';
        window.EJS_startOnLoaded = true;

        window.EJS_pathtodata = './emulator_data/';
        window.EJS_gameUrl = './roms/' + romFile;

        // 👇 2. 修正 NDS 专属配置 👇
        if (core === 'desmume' || core === 'nds' || core === 'melonds') {
            // ❌ 彻底删除 window.EJS_mouse = false;
            window.EJS_cheats = false;
            window.EJS_biosUrl = './emulator_data/nds_bios.zip';
        }
        window.EJS_VirtualGamepadSettings = { alpha: 0.5, scale: 1.1 };

        // 恢复完整的控制栏按钮，包含存档导入/导出功能
        window.EJS_Buttons = {
            playPause: true,
            restart: true,
            mute: true,
            settings: true,
            fullscreen: true,

            // --- 即时存档 (随玩随存，类似于虚拟机的快照) ---
            saveState: true,
            loadState: true,
            quickSave: true,   // 添加快捷存档按钮
            quickLoad: true,   // 添加快捷读档按钮

            // --- 实体电池存档 (游戏内真实存档，跨设备、跨核心通用) ---
            saveSavFiles: true, // 👈 核心按钮：将 .sav 存档文件导出并下载
            loadSavFiles: true  // 👈 核心按钮：将外部的 .sav 存档文件导入模拟器
        };

        // 仅保留基础的加载完毕通知逻辑// 仅保留基础的加载完毕通知逻辑
        // =========================================================================
        // 自动进度：定时 + 离开页面时自动保存「即时存档」到浏览器 IndexedDB，
        // 下次进入游戏时弹窗让玩家选择：读取存档 / 继续游戏（不读取）
        // =========================================================================
        const tukuaiResume = (() => {
            const DB_NAME = 'tukuai-resume';
            const STORE = 'states';
            const KEY = 'rom:' + romFile;
            const SAVE_INTERVAL = 30000; // 每 30 秒自动保存一次

            let enabled = false; // 玩家做出选择之前不自动保存，避免旧进度被新开局覆盖
            let timer = null;

            const openDb = () => new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = () => req.result.createObjectStore(STORE);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });

            const dbGet = async () => {
                const db = await openDb();
                return new Promise((resolve, reject) => {
                    const req = db.transaction(STORE, 'readonly').objectStore(STORE).get(KEY);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
            };

            const dbPut = async (value) => {
                const db = await openDb();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE, 'readwrite');
                    tx.objectStore(STORE).put(value, KEY);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                    tx.onabort = () => reject(tx.error);
                });
            };

            const toast = (text, ms = 2200, isWarn = false) => {
                document.querySelectorAll('.tk-jelly-toast').forEach((node) => node.remove());
                const el = document.createElement('div');
                el.className = 'tk-jelly-toast' + (isWarn ? ' tk-jelly-toast--warn' : '');

                const dot = document.createElement('span');
                dot.className = 'tk-jelly-dot';
                const label = document.createElement('span');
                label.textContent = text;

                el.appendChild(dot);
                el.appendChild(label);
                document.body.appendChild(el);

                setTimeout(() => {
                    el.classList.add('is-leaving');
                    setTimeout(() => el.remove(), 360);
                }, ms);
            };

            const saveNow = async () => {
                if (!enabled) return;
                const emu = window.EJS_emulator;
                if (!emu || !emu.started || !emu.gameManager) return;
                try {
                    const state = emu.gameManager.getState();
                    if (!state || !state.length) return;
                    await dbPut({ state: state, savedAt: Date.now(), rom: romFile });
                } catch (e) {
                    console.warn('[resume] 自动保存失败:', e);
                }
            };

            const enable = () => {
                if (enabled) return;
                enabled = true;
                timer = setInterval(() => {
                    const emu = window.EJS_emulator;
                    if (document.hidden || !emu || emu.paused) return;
                    saveNow();
                }, SAVE_INTERVAL);
            };

            const formatTime = (ts) => {
                const d = new Date(ts);
                const p = (n) => String(n).padStart(2, '0');
                return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
                    ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
            };

            // 弹窗：返回 'load'（读取存档）或 'continue'（继续游戏，不读取）
            const askUser = (rec) => new Promise((resolve) => {
                const mask = document.createElement('div');
                mask.className = 'tk-resume-mask';

                const box = document.createElement('div');
                box.className = 'tk-resume-card';
                box.innerHTML = `
                    <div class="tk-resume-title">发现上次的游戏进度</div>
                    <div class="tk-resume-time">保存于 ${formatTime(rec.savedAt)}</div>
                    <div class="tk-resume-actions">
                        <button type="button" data-act="load" class="tk-resume-btn tk-resume-btn--primary">
                            <span>📂</span><span>读取存档</span>
                        </button>
                        <button type="button" data-act="continue" class="tk-resume-btn tk-resume-btn--secondary">
                            <span>▶</span><span>重新开始</span>
                        </button>
                    </div>
                `;
                mask.appendChild(box);
                document.body.appendChild(mask);
                box.addEventListener('click', (e) => {
                    const btn = e.target.closest('button[data-act]');
                    if (!btn) return;
                    mask.remove();
                    resolve(btn.getAttribute('data-act'));
                });
            });

            const onStart = async () => {
                const emu = window.EJS_emulator;
                if (!emu || !emu.gameManager || !window.indexedDB) return;
                try {
                    if (!emu.gameManager.functions.supportsStates()) return; // 该核心不支持即时存档
                } catch (e) { return; }

                let rec = null;
                try { rec = await dbGet(); } catch (e) { console.warn('[resume] 读取失败:', e); }

                if (!rec || !rec.state) {
                    enable();
                    return;
                }

                // 弹窗期间先暂停游戏画面，等玩家选择
                try { emu.gameManager.toggleMainLoop(0); } catch (e) {}
                const choice = await askUser(rec);

                if (choice === 'load') {
                    try {
                        emu.gameManager.loadState(rec.state);
                        toast('已读取上次存档', 2200);
                    } catch (e) {
                        console.warn('[resume] 读取存档失败:', e);
                        toast('读取存档失败，已直接开始', 3000, true);
                    }
                }
                try { if (!emu.paused) emu.gameManager.toggleMainLoop(1); } catch (e) {}
                enable();
            };

            // 切走标签页、切后台、关闭页面时立即保存
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'hidden') saveNow();
            });
            window.addEventListener('pagehide', saveNow);
            // 供外层页面在关闭游戏前主动调用
            window.__tukuaiSaveNow = saveNow;

            return { onStart };
        })();

        window.EJS_onGameStart = function() {
            try { tukuaiResume.onStart(); } catch (e) { console.warn('[resume]', e); }

            // =========================================================================
            // 👇 极致隐形 + PC端彻底屏蔽的方案（说明已收拢至引擎启动右侧 ? 按钮中）👇
            // =========================================================================

            // 精准探测：只有包含移动设备标识，或者支持触控屏幕的设备，才会执行注入
            const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || ('ontouchstart' in document.documentElement);

            if (isMobile) {
                const nativeUploadBtn = document.createElement('div');
                nativeUploadBtn.style.cssText = `
                    position: absolute;
                    top: 0;
                    left: 0;
                    width: 20px;  /* 👈 将 80px 改为 20px，极大减小触控死角 */
                    height: 20px; /* 👈 将 80px 改为 20px */
                    z-index: 999999;
                    overflow: hidden;
                `;

                const fileInput = document.createElement('input');
                fileInput.type = 'file';
                fileInput.accept = '.sav,.state';
                fileInput.style.cssText = 'position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;';

                fileInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (!file) return;

                    try {
                        const dt = new DataTransfer();
                        dt.items.add(file);
                        const dropEvent = new DragEvent('drop', {
                            bubbles: true,
                            cancelable: true,
                            dataTransfer: dt
                        });

                        window.dispatchEvent(dropEvent);
                        document.getElementById('game').dispatchEvent(dropEvent);

                        const successMsg = document.createElement('div');
                        successMsg.innerHTML = '✨ 注入: ' + file.name;
                        successMsg.style.cssText = `
                            position: absolute; top: 20px; left: 20px;
                            background: rgba(74, 222, 128, 0.9); color: black;
                            padding: 6px 12px; border-radius: 8px; font-family: 'Silkscreen', 'ChinesePixel', monospace;
                            font-weight: bold; font-size: 12px; z-index: 999999;
                            transition: opacity 0.5s ease; box-shadow: 0 0 15px rgba(74, 222, 128, 0.5);
                        `;
                        document.body.appendChild(successMsg);

                        setTimeout(() => {
                            successMsg.style.opacity = '0';
                            setTimeout(() => successMsg.remove(), 500);
                        }, 2000);

                    } catch (err) {
                        alert('底层注入失败: ' + err);
                    }

                    fileInput.value = '';
                });

                nativeUploadBtn.appendChild(fileInput);
                document.body.appendChild(nativeUploadBtn);
            }
        };

        const loaderScript = document.createElement('script');
        loaderScript.src = window.EJS_pathtodata + 'loader.js';
        document.body.appendChild(loaderScript);
    }
</script>
</body>
</html>
