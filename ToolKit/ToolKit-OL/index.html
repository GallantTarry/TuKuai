<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travelers - 数据校对助手</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="https://cdn.staticfile.net/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.staticfile.net/echarts/5.5.0/echarts.min.js"></script>
    
    <style>
        :root {
            --bg-color: #2d3032;
            --text-color: #e6e6e6;
            --border-color: #808080;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: "Microsoft YaHei", sans-serif;
            background: url('texture2.png') no-repeat center center fixed;
            background-size: cover;
            overflow: hidden;
        }

        /* 全局浮动音乐播放器 - 右上角固定 */
        #musicPlayer {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 30px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            z-index: 1000;
            color: white;
            font-size: 13px;
            user-select: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        #musicPlayer:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.03);
        }
        #musicIcon {
            display: inline-block;
            transition: transform 0.3s;
        }
        @keyframes rotateMusic {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .playing #musicIcon {
            animation: rotateMusic 4s linear infinite;
        }

        /* 首页布局 */
        #homePanel {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-sizing: border-box;
        }
        
        /* 独立出来的中央拖拽/点击区域框 */
        #dropZone {
            width: 85%;
            max-width: 550px;
            height: 320px;
            border: 2px dashed rgba(255, 255, 255, 0.35);
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-sizing: border-box;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
        }
        #dropZone:hover, #dropZone.dragover {
            border-color: rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }
        
        .title-text {
            font-family: monospace; font-size: clamp(28px, 4vw, 52px);
            font-weight: bold; color: white; letter-spacing: 8px;
            text-align: center; pointer-events: none;
            margin-bottom: 15px;
        }
        .subtitle-text {
            color: rgba(255,255,255,0.6); font-size: 14px;
            pointer-events: none; text-align: center; line-height: 1.6;
        }

        /* 输入框安全隐藏方案 */
        #fileInput {
            position: absolute; width: 0; height: 0; opacity: 0; overflow: hidden; z-index: -1;
        }

        /* 校对结果看板 */
        #dashboardPanel {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); z-index: 10;
            flex-direction: column; box-sizing: border-box; padding: 20px;
            overflow-y: auto;
        }

        .header-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; flex-shrink: 0; padding-right: 180px;
        }
        .header-bar button {
            background: transparent; color: var(--text-color); border: 1px solid var(--border-color);
            padding: 8px 16px; border-radius: 4px; cursor: pointer; font-family: inherit;
        }
        .header-bar button:hover { background: rgba(255,255,255,0.1); }

        .main-content { display: flex; flex: 1; gap: 15px; min-height: 0; }
        .box {
            border: 1px solid var(--border-color); border-radius: 6px;
            padding: 15px 10px 10px 10px; display: flex; flex-direction: column; position: relative;
        }
        .box-title {
            position: absolute; top: -10px; left: 10px; background: var(--bg-color);
            padding: 0 5px; font-weight: bold; font-size: 13px; color: var(--text-color);
        }

        .log-area, .detail-area {
            flex: 1; background: transparent; color: var(--text-color); border: none;
            resize: none; font-family: inherit; font-size: 13px; outline: none; line-height: 1.5;
            overflow-y: auto; white-space: pre-wrap;
        }

        .left-col { flex: 0 0 380px; display: flex; flex-direction: column; }
        .right-col { flex: 1; display: flex; gap: 15px; }
        .chart-box { flex: 1; min-height: 300px; }
        .detail-box { flex: 0 0 280px; }

        #chartContainer { width: 100%; height: 100%; }

        @media (max-width: 900px) {
            #musicPlayer { top: 10px; right: 10px; padding: 6px 12px; font-size: 12px; }
            #dashboardPanel { padding: 10px; }
            .header-bar { padding-right: 140px; flex-direction: column; align-items: flex-start; gap: 10px; }
            .main-content { flex-direction: column; overflow-y: auto; }
            .left-col { flex: none; height: 250px; }
            .right-col { flex-direction: column; flex: none; gap: 15px; }
            .chart-box { height: 350px; flex: none; }
            .detail-box { height: 250px; flex: none; }
        }
    </style>
</head>
<body>

    <div id="musicPlayer">
        <span id="musicIcon">🎵</span>
        <span id="musicStatus">Travelers (已暂停)</span>
    </div>

    <div id="homePanel">
        <div id="dropZone">
            <div class="title-text">Travelers</div>
            <div class="subtitle-text">点击选择或拖拽报价 Excel 至此处</div>
        </div>
        <input type="file" id="fileInput" accept=".xlsx, .xls">
    </div>

    <audio id="bgMusic" src="music/Travelers.mp3" loop></audio>

    <div id="dashboardPanel">
        <div class="header-bar">
            <button id="backBtn">&lt;&lt; Menu</button>
            <button id="exportBtn">导出校验分析报告</button>
        </div>
        
        <div class="main-content">
            <div class="box left-col">
                <div class="box-title">协同校验预警明细(单位:万元/%)</div>
                <textarea id="logArea" class="log-area" readonly></textarea>
            </div>
            
            <div class="right-col">
                <div class="box chart-box">
                    <div class="box-title">异常供应商绝对报价走势 (无缝动态 X 轴)</div>
                    <div id="chartContainer"></div>
                </div>
                
                <div class="box detail-box">
                    <div class="box-title">各轮降幅百分比明细</div>
                    <textarea id="detailArea" class="detail-area" readonly></textarea>
                </div>
            </div>
        </div>
    </div>

    <script>
        const musicPlayer = document.getElementById('musicPlayer');
        const musicStatus = document.getElementById('musicStatus');
        const bgMusic = document.getElementById('bgMusic');
        let isMusicPlaying = false;

        musicPlayer.addEventListener('click', () => {
            if (!isMusicPlaying) {
                bgMusic.play().then(() => {
                    isMusicPlaying = true;
                    musicPlayer.classList.add('playing');
                    musicStatus.innerText = "Travelers (播放中)";
                }).catch(e => {
                    alert("无法自动播放音频，请确保 music/Travelers.mp3 路径正确并存在。");
                });
            } else {
                bgMusic.pause();
                isMusicPlaying = false;
                musicPlayer.classList.remove('playing');
                musicStatus.innerText = "Travelers (已暂停)";
            }
        });

        const homePanel = document.getElementById('homePanel');
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const dashboardPanel = document.getElementById('dashboardPanel');
        const backBtn = document.getElementById('backBtn');
        let chartInstance = null;

        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault(); dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) processExcel(e.dataTransfer.files[0]);
        });

        dropZone.addEventListener('click', (e) => {
            e.stopPropagation();
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) processExcel(e.target.files[0]);
            fileInput.value = ''; 
        });

        backBtn.addEventListener('click', () => {
            dashboardPanel.style.display = 'none';
            homePanel.style.display = 'flex';
        });

        const ROUNDS = ["首轮报价", "二轮报价", "三轮报价", "四轮报价", "五轮报价", "六轮报价", "终轮报价"];

        function processExcel(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(sheet, {header: 1, defval: ""});
                    analyzeData(json);
                } catch (error) {
                    alert("Excel 数据解析失败，请确认报表规范。\n" + error);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function analyzeData(rows) {
            let supIdx = -1, pkgIdx = -1;
            let colIdxMap = new Array(ROUNDS.length).fill(-1);
            let foundHeader = false;

            let globalErrors = [];
            let globalDropDataMap = new Map();
            let globalPriceDataMap = new Map();
            let globalFlaggedKeys = new Set();

            let pkgPercentDupMap = {};
            let pkgValueDupMap = {};
            let pkgRoundPricesMap = {};

            for (let row of rows) {
                if (!foundHeader) {
                    row.forEach((cell, idx) => {
                        let val = String(cell).trim();
                        if (val.includes("供应商名称")) supIdx = idx;
                        if (val === "标包编号") pkgIdx = idx;
                        let rIdx = ROUNDS.indexOf(val);
                        if (rIdx !== -1) colIdxMap[rIdx] = idx;
                    });
                    if (supIdx !== -1) foundHeader = true;
                    continue;
                }

                if (!row[supIdx]) continue;
                let company = String(row[supIdx]).replace(/[\n\r\t]/g, "").trim();
                if (!company || company.includes("※")) continue;

                let pkgName = "默认标包";
                if (pkgIdx !== -1 && String(row[pkgIdx]).trim() !== "") {
                    pkgName = String(row[pkgIdx]).trim();
                }

                let uniqueKey = `${company} [${pkgName}]`;
                let prevPrice = null;
                let prevRoundName = null;
                let companyDrops = [];
                let companyPrices = [];

                for (let i = 0; i < colIdxMap.length; i++) {
                    let cIdx = colIdxMap[i];
                    if (cIdx === -1) continue;
                    
                    let cellVal = row[cIdx];
                    let currPrice = null;

                    if (cellVal !== undefined && cellVal !== null) {
                        let strVal = String(cellVal).trim();
                        if (strVal !== "" && !isNaN(Number(strVal))) {
                            currPrice = Number(strVal);
                        }
                    }

                    if (currPrice !== null) {
                        companyPrices.push({roundName: ROUNDS[i], price: currPrice});

                        if (!pkgRoundPricesMap[pkgName]) pkgRoundPricesMap[pkgName] = {};
                        if (!pkgRoundPricesMap[pkgName][i]) pkgRoundPricesMap[pkgName][i] = {};
                        pkgRoundPricesMap[pkgName][i][uniqueKey] = currPrice;

                        if (prevPrice !== null && prevRoundName !== null) {
                            if (currPrice > prevPrice) {
                                globalErrors.push(`【涨价异常】${uniqueKey}\n    ${ROUNDS[i]}(${currPrice}) 高于上一轮 ${prevRoundName}(${prevPrice})`);
                                globalFlaggedKeys.add(uniqueKey);
                            }

                            let dropPercent = 0.0;
                            if (prevPrice > 0) {
                                dropPercent = ((prevPrice - currPrice) / prevPrice) * 100.0;
                                let percentStr = dropPercent.toFixed(4);

                                if (!pkgPercentDupMap[pkgName]) pkgPercentDupMap[pkgName] = {};
                                if (!pkgPercentDupMap[pkgName][i]) pkgPercentDupMap[pkgName][i] = {};
                                if (!pkgPercentDupMap[pkgName][i][percentStr]) pkgPercentDupMap[pkgName][i][percentStr] = [];
                                pkgPercentDupMap[pkgName][i][percentStr].push(uniqueKey);

                                let dropValue = prevPrice - currPrice;
                                if (dropValue > 0.0001) {
                                    let valueStr = dropValue.toFixed(2);
                                    if (!pkgValueDupMap[pkgName]) pkgValueDupMap[pkgName] = {};
                                    if (!pkgValueDupMap[pkgName][i]) pkgValueDupMap[pkgName][i] = {};
                                    if (!pkgValueDupMap[pkgName][i][valueStr]) pkgValueDupMap[pkgName][i][valueStr] = [];
                                    pkgValueDupMap[pkgName][i][valueStr].push(uniqueKey);
                                }
                            }
                            let phaseName = `${prevRoundName.replace("报价","")}->${ROUNDS[i].replace("报价","")}`;
                            companyDrops.push({phaseName, dropPercent});
                        }
                        prevPrice = currPrice;
                        prevRoundName = ROUNDS[i];
                    }
                }
                if (companyDrops.length > 0) globalDropDataMap.set(uniqueKey, companyDrops);
                if (companyPrices.length > 0) globalPriceDataMap.set(uniqueKey, companyPrices);
            }

            for (let pkgName in pkgRoundPricesMap) {
                let pMap = pkgPercentDupMap[pkgName] || {};
                for (let roundIdx in pMap) {
                    for (let pStr in pMap[roundIdx]) {
                        let keys = pMap[roundIdx][pStr];
                        if (keys.length > 1 && parseFloat(pStr) > 0.0001) {
                            globalErrors.push(`【一致比例降幅】[${pkgName}] ${ROUNDS[roundIdx]} 降幅: ${pStr}%\n    涉及:\n      - ${keys.join('\n      - ')}`);
                            keys.forEach(k => globalFlaggedKeys.add(k));
                        }
                    }
                }

                let vMap = pkgValueDupMap[pkgName] || {};
                for (let roundIdx in vMap) {
                    for (let vStr in vMap[roundIdx]) {
                        let keys = vMap[roundIdx][vStr];
                        if (keys.length > 1) {
                            globalErrors.push(`【一致定额降幅】[${pkgName}] ${ROUNDS[roundIdx]} 降额: ${vStr}\n    涉及:\n      - ${keys.join('\n      - ')}`);
                            keys.forEach(k => globalFlaggedKeys.add(k));
                        }
                    }
                }

                let roundPrices = pkgRoundPricesMap[pkgName];
                for (let roundIdx in roundPrices) {
                    let prices = roundPrices[roundIdx];
                    if (Object.keys(prices).length >= 3) {
                        checkAPGP(`[${pkgName}] ${ROUNDS[roundIdx]}`, prices, globalErrors, globalFlaggedKeys);
                    }
                }
            }

            if (globalErrors.length === 0 && globalFlaggedKeys.size === 0) {
                alert("校对完成，数据逻辑正常，未发现同标包协同风险。");
            } else {
                let flaggedDrops = new Map();
                let flaggedPrices = new Map();
                globalFlaggedKeys.forEach(k => {
                    if (globalDropDataMap.has(k)) flaggedDrops.set(k, globalDropDataMap.get(k));
                    if (globalPriceDataMap.has(k)) flaggedPrices.set(k, globalPriceDataMap.get(k));
                });
                
                showDashboard(globalErrors, flaggedPrices, flaggedDrops);
            }
        }

        function checkAPGP(roundName, companyPrices, errors, flaggedCompanies) {
            let list = Object.entries(companyPrices).map(([k, v]) => ({key: k, val: v}));
            list.sort((a, b) => a.val - b.val);
            let n = list.length;

            for (let i = 0; i < n - 2; i++) {
                for (let j = i + 1; j < n - 1; j++) {
                    let p1 = list[i].val, p2 = list[j].val;
                    let diff = p2 - p1;

                    if (diff > 0.0001) {
                        let apSeq = [`${list[i].key}(${p1})`, `${list[j].key}(${p2})`];
                        let rawNames = [list[i].key, list[j].key];
                        let expected = p2 + diff;
                        for (let k = j + 1; k < n; k++) {
                            if (Math.abs(list[k].val - expected) < 0.0001) {
                                apSeq.push(`${list[k].key}(${list[k].val})`);
                                rawNames.push(list[k].key);
                                expected += diff;
                            }
                        }
                        if (apSeq.length >= 3) {
                            errors.push(`【等差串通预警】${roundName} 中发现等差报价序列 (等差额: ${diff.toFixed(2)})\n    涉及:\n      - ${apSeq.join('\n      - ')}`);
                            rawNames.forEach(name => flaggedCompanies.add(name));
                        }
                    }

                    if (p1 > 0.0001) {
                        let ratio = p2 / p1;
                        if (ratio > 1.0001) {
                            let gpSeq = [`${list[i].key}(${p1})`, `${list[j].key}(${p2})`];
                            let rawNamesGP = [list[i].key, list[j].key];
                            let expected = p2 * ratio;
                            for (let k = j + 1; k < n; k++) {
                                if (Math.abs(list[k].val - expected) < 0.0001) {
                                    gpSeq.push(`${list[k].key}(${list[k].val})`);
                                    rawNamesGP.push(list[k].key);
                                    expected *= ratio;
                                }
                            }
                            if (gpSeq.length >= 3) {
                                errors.push(`【等比串通预警】${roundName} 中发现等比报价序列 (比例系数: ${ratio.toFixed(4)})\n    涉及:\n      - ${gpSeq.join('\n      - ')}`);
                                rawNamesGP.forEach(name => flaggedCompanies.add(name));
                            }
                        }
                    }
                }
            }

            let descList = [...list].sort((a, b) => b.val - a.val);
            for (let i = 0; i < n - 3; i++) {
                for (let j = i + 1; j < n - 2; j++) {
                    for (let k = j + 1; k < n - 1; k++) {
                        let p1 = descList[i].val, p2 = descList[j].val, p3 = descList[k].val;
                        let d1 = p1 - p2, d2 = p2 - p3;

                        if (d1 > 0.0001 && d2 > 0.0001) {
                            let diffRatio = d2 / d1;
                            let diffGpSeq = [`${descList[i].key}(${p1})`, `${descList[j].key}(${p2})`, `${descList[k].key}(${p3})`];
                            let rawNamesDiffGP = [descList[i].key, descList[j].key, descList[k].key];
                            
                            let expectedDiff = d2 * diffRatio;
                            let expectedPrice = p3 - expectedDiff;

                            for (let m = k + 1; m < n; m++) {
                                if (Math.abs(descList[m].val - expectedPrice) < 0.0001) {
                                    diffGpSeq.push(`${descList[m].key}(${descList[m].val})`);
                                    rawNamesDiffGP.push(descList[m].key);
                                    expectedDiff *= diffRatio;
                                    expectedPrice -= expectedDiff;
                                }
                            }
                            if (diffGpSeq.length >= 4) {
                                errors.push(`【差值等比串通预警】${roundName} 中发现差值呈等比递减规律 (差值衰减系数: ${diffRatio.toFixed(4)})\n    涉及:\n      - ${diffGpSeq.join('\n      - ')}`);
                                rawNamesDiffGP.forEach(name => flaggedCompanies.add(name));
                            }
                        }
                    }
                }
            }
        }

        function showDashboard(errors, flaggedPrices, flaggedDrops) {
            homePanel.style.display = 'none';
            dashboardPanel.style.display = 'flex';

            document.getElementById('logArea').value = errors.join('\n\n');

            let detailStr = "";
            flaggedDrops.forEach((drops, key) => {
                detailStr += `【${key}】\n`;
                drops.forEach(node => {
                    detailStr += `  ${node.phaseName} : ${node.dropPercent.toFixed(2)}%\n`;
                });
                detailStr += `\n`;
            });
            document.getElementById('detailArea').value = detailStr;

            renderChart(flaggedPrices);
        }

        function renderChart(priceData) {
            if (chartInstance) chartInstance.dispose();
            chartInstance = echarts.init(document.getElementById('chartContainer'));

            let activeRounds = [];
            priceData.forEach((prices) => {
                prices.forEach(node => {
                    if (!activeRounds.includes(node.roundName)) {
                        activeRounds.push(node.roundName);
                    }
                });
            });
            activeRounds.sort((a, b) => ROUNDS.indexOf(a) - ROUNDS.indexOf(b));

            let legendData = [];
            let seriesData = [];
            
            priceData.forEach((prices, companyKey) => {
                let dataArr = activeRounds.map(r => {
                    let node = prices.find(p => p.roundName === r);
                    return node ? node.price : null;
                });
                
                let shortName = companyKey.length > 10 ? companyKey.substring(0, 10) + '..' : companyKey;
                legendData.push(shortName);
                
                seriesData.push({
                    name: shortName,
                    type: 'line',
                    data: dataArr,
                    symbolSize: 8,
                    smooth: false,
                    connectNulls: true
                });
            });

            let option = {
                tooltip: { trigger: 'item', formatter: '{a} <br/>{b}: {c} 万' },
                legend: { 
                    type: 'scroll', orient: 'vertical', right: 0, top: 20, 
                    textStyle: { color: '#e6e6e6' }, data: legendData
                },
                grid: { left: '3%', right: '140px', bottom: '15%', containLabel: true },
                dataZoom: [
                    { type: 'inside', xAxisIndex: 0, filterMode: 'none' },
                    { type: 'inside', yAxisIndex: 0, filterMode: 'empty' }
                ],
                xAxis: { 
                    type: 'category', boundaryGap: false, data: activeRounds,
                    axisLabel: { color: '#e6e6e6' }
                },
                yAxis: { 
                    type: 'value', scale: true, 
                    axisLabel: { color: '#e6e6e6' },
                    splitLine: { lineStyle: { type: 'dashed', color: '#606060' } }
                },
                series: seriesData
            };
            
            chartInstance.setOption(option);
            window.addEventListener('resize', () => { if(chartInstance) chartInstance.resize(); });
        }

        // 仅保留生成纯文本分析报告
        document.getElementById('exportBtn').addEventListener('click', () => {
            const timestamp = new Date().getTime();
            
            let txtContent = "================ 数据逻辑协同预警明细 ================\n\n" + 
                             document.getElementById('logArea').value + 
                             "\n\n================ 各轮降幅详细明细 ================\n\n" + 
                             document.getElementById('detailArea').value;
            let blob = new Blob([txtContent], {type: "text/plain;charset=utf-8"});
            let link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `协同校验分析报告_${timestamp}.txt`;
            link.click();
        });
    </script>
</body>
</html>
