<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tukuai Emulator Core</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4ade80;
            font-family: monospace;
        }
        #game-container {
            width: 100%;
            height: 100%;
        }
        /* 友好的提示小条，过几秒自动消失 */
        #focus-hint {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #4ade80;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            pointer-events: none;
            z-index: 9999;
            animation: fadeout 4s forwards;
            animation-delay: 3s;
        }
        @keyframes fadeout {
            to { opacity: 0; visibility: hidden; }
        }
        /* ========================================== */
        /* 核心修复：破解手机端触屏穿透与点击失效 Bug */
        /* ========================================== */

        /* 1. 强制唤醒移动端的 click 事件（迫使手机浏览器把模拟器的 UI 认作按钮） */
        #game div {
            cursor: pointer !important;
            -webkit-tap-highlight-color: transparent;
        }

        /* 2. 强制将弹出菜单和控制栏拉到最顶层，彻底摆脱透明虚拟摇杆的遮挡 */
        #game > div:not(:first-child) {
            z-index: 999999 !important;
            pointer-events: auto !important;
        }
    </style>
</head>
<body>

    <div id="focus-hint">💡 提示：按键无反应请先【点击游戏画面】。</div>

    <div id="game-container">
        <div id="game"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const romFile = urlParams.get('rom');
        const coreParam = urlParams.get('core');

        if (!romFile) {
            document.body.innerHTML = `
                <div style="text-align:center; line-height: 2;">
                    <div style="font-size: 3rem; margin-bottom: 1rem;">⚠️</div>
                    <h3>SYSTEM ERROR: NO ROM DETECTED</h3>
                    <p style="color: #64748b; font-size: 12px;">Missing "?rom=filename" parameter in URL.</p>
                </div>
            `;
        } else {
            window.EJS_player = '#game';

            // 动态判断模拟器核心
            let core = 'gba';
            if (coreParam) {
                core = coreParam;
            } else {
                const ext = romFile.split('.').pop().toLowerCase();
                if (ext === 'sfc' || ext === 'smc') {
                    core = 'snes';
                } else if (ext === 'nes') {
                    core = 'nes';
                } else if (ext === 'gb' || ext === 'gbc') {
                    core = 'gb';
                }
            }
            window.EJS_core = core;
            window.EJS_gameName = romFile;
            window.EJS_language = 'en';

            // 确保你的 GitHub 仓库中有对应的 rom 文件夹和文件
            window.EJS_gameUrl = '../rom/' + romFile;
            window.EJS_pathtodata = '../emulator_data/';

            window.EJS_color = '#000000';
            window.EJS_startOnLoaded = true;

            // 确保开启了 settings，这样才能呼出原生菜单进行存档管理
            window.EJS_Buttons = {
                playPause: false,
                restart: true,
                mute: true,
                settings: true,
                fullscreen: false
            };

            // 游戏启动完毕后，强制抢夺系统键盘焦点
            window.EJS_onGameStart = function() {
                console.log("[Emulator Core] 游戏已启动，正在获取焦点...");
                window.focus();
                setTimeout(() => {
                    const canvas = document.querySelector('#game canvas');
                    if(canvas) {
                        canvas.focus();
                    }
                }, 500);
            };
        }
    </script>

    <script src="../emulator_data/loader.js"></script>

    <script>
        // 跨窗口通信监听 (针对 iframe 嵌套优化)
        window.addEventListener('message', (event) => {
            if (event.data === 'focus-emulator') {
                const canvas = document.querySelector('canvas');
                if (canvas) {
                    canvas.setAttribute('tabindex', '0');
                    canvas.focus();
                }
            }
        });

        // 页面加载完成后，告诉父级 iframe 窗口自己准备好了
        window.addEventListener('load', () => {
            if (window.parent) {
                window.parent.postMessage('emulator-ready', '*');
            }
        });

        // 👇 新增这部分：移动端“触屏转物理点击”强制唤醒器 👇
        document.addEventListener('touchend', function(e) {
            // 如果手指点击的不是游戏画面 (canvas)，说明点在了存档 UI 或菜单上
            if (e.target && e.target.tagName && e.target.tagName.toLowerCase() !== 'canvas') {
                // 强行派发真实点击事件，专治手机端死活点不动的毛病
                e.target.click();
            }
        }, { passive: true });
        // 👆 ==================================================== 👆
    </script>
</body>
</html>
