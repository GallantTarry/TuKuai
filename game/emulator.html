<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 升级 1：加入 viewport-fit=cover，彻底禁止网页的回弹橡皮筋效果 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tukuai Emulator Core</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4ade80;
            font-family: monospace;
            /* 升级 2：CSS 层级彻底封杀移动端的下拉刷新、侧滑返回和双击放大 */
            overscroll-behavior: none;
            /* 👇 改这里：从 none 改为 manipulation，允许正常的指针交互 👇 */
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }
        #game-container {
            width: 100%;
            height: 100%;
        }
        #focus-hint {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #4ade80;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 12px;
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 4px 15px rgba(74, 222, 128, 0.2);
            /* 延长提示时间，确保手机端玩家能看清 */
            animation: fadeout 1s forwards;
            animation-delay: 6s;
        }
        @keyframes fadeout {
            to { opacity: 0; visibility: hidden; transform: translate(-50%, -10px); }
        }
    </style>

</head>
<body>

<div id="focus-hint">💡 提示：按键无反应请先【点击游戏画面】<br><span style="color:#94a3b8; font-size:10px;">祝您玩的开心</span></div>

<div id="game-container">
    <div id="game"></div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const romFile = urlParams.get('rom');
    const coreParam = urlParams.get('core');

    if (!romFile) {
        document.body.innerHTML = `
                <div style="text-align:center; line-height: 2;">
                    <div style="font-size: 3rem; margin-bottom: 1rem;">⚠️</div>
                    <h3>SYSTEM ERROR: NO ROM DETECTED</h3>
                    <p style="color: #64748b; font-size: 12px;">Missing "?rom=filename" parameter in URL.</p>
                </div>
            `;
    } else {
        window.EJS_player = '#game';

        // 动态判断模拟器核心
        let core = 'gba';
        if (coreParam) {
            core = coreParam;
        } else {
            const ext = romFile.split('.').pop().toLowerCase();
            if (ext === 'sfc' || ext === 'smc') {
                core = 'snes';
            } else if (ext === 'nes') {
                core = 'nes';
            } else if (ext === 'gb' || ext === 'gbc') {
                core = 'gb';
            }
        }
        window.EJS_core = core;
        window.EJS_gameName = romFile;
        window.EJS_language = 'zh-CN'; // 强制界面中文，提升体验

        // 确保你的 GitHub 仓库中有对应的 rom 文件夹和文件
        window.EJS_gameUrl = '../rom/' + romFile;
        window.EJS_pathtodata = '../emulator_data/';

        // 👇 核心修复：根据 ROM 文件名动态生成一个唯一的数字 ID，防止多游戏存档冲突
        let uniqueGameID = 0;
        for (let i = 0; i < romFile.length; i++) {
            uniqueGameID = ((uniqueGameID << 5) - uniqueGameID) + romFile.charCodeAt(i);
            uniqueGameID |= 0;
        }
        window.EJS_gameID = Math.abs(uniqueGameID);

        window.EJS_color = '#000000';
        window.EJS_startOnLoaded = true;

        // 升级 3：优化移动端虚拟按键体验配置
        window.EJS_VirtualGamepadSettings = {
            alpha: 0.5, // 按键透明度
            scale: 1.1  // 稍微放大虚拟按键，防止误触
        };

        window.EJS_Buttons = {
            playPause: true, // 开启暂停按钮，切后台时可以用
            restart: true,
            mute: true,
            settings: true,
            fullscreen: true, // 手机端极其需要全屏按钮
            saveState: true,
            loadState: true
        };

        // 升级 4：利用系统级事件拦截 F5 或页面关闭，强行打断“猝死”操作
        // 核心函数：强制将 WebAssembly 虚拟文件系统 (MEMFS) 中的存档刷入手机本地 IndexedDB
        function forceSyncSave() {
            try {
                if (window.EJS_emulator && window.EJS_emulator.gameManager) {
                    // 1. 触发游戏内部的 SRAM 存档导出
                    if (typeof window.EJS_emulator.gameManager.saveSave === 'function') {
                        window.EJS_emulator.gameManager.saveSave();
                    }
                    // 2. 将 Emscripten 虚拟内存同步刷入浏览器持久化 IndexedDB
                    if (window.EJS_emulator.gameManager.FS && window.EJS_emulator.gameManager.FS.syncfs) {
                        window.EJS_emulator.gameManager.FS.syncfs(false, function (err) {
                            if (err) {
                                console.error("[Emulator Core] 存档写入 IndexedDB 失败:", err);
                            } else {
                                console.log("[Emulator Core] 存档已成功持久化至本地 IndexedDB！");
                            }
                        });
                    }
                }
            } catch (e) {
                console.warn("[Emulator Core] 自动存盘异常:", e);
            }
        }

        // 升级 4：切后台或息屏时立即写入磁盘 (解决手机端息屏直接杀进程丢档)
        document.addEventListener("visibilitychange", function() {
            if (document.visibilityState === 'hidden') {
                console.log("[Emulator Core] 网页切后台/息屏，立即持久化存档");
                forceSyncSave();
            }
        });

        // 升级 5：针对手机端 Safari/Chrome 替换 beforeunload，改用移动端专用的 pagehide
        window.addEventListener("pagehide", forceSyncSave);

        // 保留 PC 端防误触 F5 刷新
        window.addEventListener('beforeunload', function (e) {
            forceSyncSave();
            const confirmationMessage = '游戏可能正在保存进度，确定要强制退出吗？';
            e.returnValue = confirmationMessage;
            return confirmationMessage;
        });
        // 游戏启动完毕后，强制抢夺系统键盘焦点
        window.EJS_onGameStart = function() {
            console.log("[Emulator Core] 游戏已启动，正在获取焦点...");
            window.focus();
            setTimeout(() => {
                const canvas = document.querySelector('#game canvas');
                if(canvas) {
                    canvas.focus();
                }
            }, 500);
        };
    }
</script>

<script src="../emulator_data/loader.js"></script>

<script>
    // 跨窗口通信监听 (针对 iframe 嵌套优化)
    // 跨窗口通信监听 (针对 iframe 嵌套优化)
    window.addEventListener('message', (event) => {
        if (event.data === 'focus-emulator') {
            const canvas = document.querySelector('canvas');
            if (canvas) {
                canvas.setAttribute('tabindex', '0');
                canvas.focus();
            }
        }

        // 👇【新增】：接收父级发来的紧急存盘指令
        if (event.data === 'save-before-close') {
            console.log("[Emulator Core] 收到父页面关闭指令，正在紧急写入 IndexedDB...");
            if (typeof forceSyncSave === 'function') {
                forceSyncSave();
            }
        }
    });

    // 👇【新增】：解决手机端读取存档（Load State）后 AudioContext 被挂起导致画面卡死的问题
    function unlockAudio() {
        if (window.EJS_emulator && window.EJS_emulator.audioContext) {
            if (window.EJS_emulator.audioContext.state === 'suspended') {
                window.EJS_emulator.audioContext.resume();
            }
        }
    }
    window.addEventListener('touchstart', unlockAudio, { passive: true });
    window.addEventListener('touchend', unlockAudio, { passive: true });

    // 升级 6：阻止 iOS Safari 的多余手势事件冒泡到外层 iframe
    // document.addEventListener('touchmove', function (event) {
    //     event.preventDefault();
    // }, { passive: false });

    // 页面加载完成后，告诉父级 iframe 窗口自己准备好了
    window.addEventListener('load', () => {
        if (window.parent) {
            window.parent.postMessage('emulator-ready', '*');
        }
    });
</script>
</body>
</html>
