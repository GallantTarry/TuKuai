<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tukuai Emulator Core</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4ade80;
            font-family: monospace;
            overscroll-behavior: none;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }
        #game-container {
            width: 100%;
            height: 100%;
        }

        #focus-hint {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #4ade80;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 12px;
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 4px 15px rgba(74, 222, 128, 0.2);
            animation: fadeout 1s forwards;
            animation-delay: 6s;
        }
        @keyframes fadeout {
            to { opacity: 0; visibility: hidden; transform: translate(-50%, -10px); }
        }
    </style>
</head>
<body>

<div id="focus-hint">💡 提示：按键无反应请先【点击游戏画面】<br><span style="color:#94a3b8; font-size:10px;">祝您玩的开心</span></div>

<div id="game-container">
    <div id="game"></div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const romFile = urlParams.get('rom');
    const coreParam = urlParams.get('core');

    if (!romFile) {
        document.body.innerHTML = `
            <div style="text-align:center; line-height: 2;">
                <div style="font-size: 3rem; margin-bottom: 1rem;">⚠️</div>
                <h3>SYSTEM ERROR: NO ROM DETECTED</h3>
                <p style="color: #64748b; font-size: 12px;">Missing "?rom=filename" parameter in URL.</p>
            </div>
        `;
    } else {
        window.EJS_player = '#game';

        let core = 'gba';
        if (coreParam) {
            core = coreParam;
        } else {
            const ext = romFile.split('.').pop().toLowerCase();
            if (ext === 'sfc' || ext === 'smc') core = 'snes';
            else if (ext === 'nes') core = 'nes';
            else if (ext === 'gb' || ext === 'gbc') core = 'gb';
        }

        window.EJS_core = core;
        window.EJS_gameName = romFile;
        window.EJS_language = 'zh-CN';
        window.EJS_gameUrl = '../rom/' + romFile;
        window.EJS_pathtodata = '../emulator_data/';

        let uniqueGameID = 0;
        for (let i = 0; i < romFile.length; i++) {
            uniqueGameID = ((uniqueGameID << 5) - uniqueGameID) + romFile.charCodeAt(i);
            uniqueGameID |= 0;
        }
        window.EJS_gameID = Math.abs(uniqueGameID);
        window.EJS_color = '#000000';
        window.EJS_startOnLoaded = true;

        window.EJS_VirtualGamepadSettings = {
            alpha: 0.5,
            scale: 1.1
        };

        window.EJS_Buttons = {
            playPause: true,
            restart: true,
            mute: true,
            settings: true,
            fullscreen: true,
            saveState: true,
            loadState: true
        };

        window.EJS_onGameStart = function() {
            window.focus();
            setTimeout(() => {
                const canvas = document.querySelector('#game canvas');
                if (canvas) canvas.focus();
            }, 500);
        };
    }

    // =========================================================================
    // 1. IndexedDB 存储引擎 (管理电池存档与即时快照)
    // =========================================================================
    const SAVE_KEY_BATTERY = 'battery_sav_' + romFile;

    function getDB() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open('tukuai_emulator_db', 1);
            req.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('saves')) {
                    db.createObjectStore('saves');
                }
            };
            req.onsuccess = (e) => resolve(e.target.result);
            req.onerror = (e) => reject(e);
        });
    }

    async function storeData(key, data) {
        const db = await getDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction('saves', 'readwrite');
            tx.objectStore('saves').put(data, key);
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
        });
    }

    async function fetchData(key) {
        const db = await getDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction('saves', 'readonly');
            const req = tx.objectStore('saves').get(key);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    }

    // =========================================================================
    // 2. 核心存盘机制：拦截 Emscripten 虚拟文件系统 (FS)
    // =========================================================================
    // EmulatorJS 内部使用了 Emscripten。SRAM 数据保存在虚拟的 /home/web_user/retroarch/userdata/saves 目录下。
    // 我们需要强制让这个目录与 IndexedDB 同步。

    let fsSyncTimer = null;

    function initFSSync() {
        if (!window.EJS_emulator || !window.EJS_emulator.FS) {
            // 如果还未加载完 FS，稍后重试
            fsSyncTimer = setTimeout(initFSSync, 1000);
            return;
        }

        console.log('[EJS] 文件系统挂载成功，启动定时刷盘');

        // 定期强制 RetroArch 将内存数据写入虚拟文件系统 (FS)
        setInterval(() => {
            if (window.EJS_emulator && typeof window.EJS_emulator.saveSave === 'function') {
                try {
                    window.EJS_emulator.saveSave();
                } catch(e) {}
            }
        }, 5000);

        // 监听页面隐藏/卸载事件，执行紧急刷盘
        const emergencySync = () => {
            if (window.EJS_emulator && typeof window.EJS_emulator.saveSave === 'function') {
                try { window.EJS_emulator.saveSave(); } catch(e) {}
            }
            if (window.EJS_emulator && window.EJS_emulator.FS && window.EJS_emulator.FS.syncfs) {
                window.EJS_emulator.FS.syncfs(false, (err) => {
                    if (err) console.error("同步 IndexedDB 失败", err);
                });
            }
        };

        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === 'hidden') emergencySync();
        });
        window.addEventListener("pagehide", emergencySync);
        window.addEventListener("beforeunload", emergencySync);
    }


    // =========================================================================
    // 3. 拦截手机端文件选择器，处理 .state (快照) 和 .sav (电池)
    // =========================================================================
    function resumeAudioAndRender() {
        if (window.EJS_emulator && window.EJS_emulator.audioContext) {
            if (window.EJS_emulator.audioContext.state === 'suspended') {
                window.EJS_emulator.audioContext.resume();
            }
        }
        // 尝试恢复主循环
        if (window.EJS_emulator && window.EJS_emulator.Module && typeof window.EJS_emulator.Module.resumeMainLoop === 'function') {
            window.EJS_emulator.Module.resumeMainLoop();
        }
    }

    window.addEventListener('touchstart', resumeAudioAndRender, { passive: true });
    window.addEventListener('touchend', resumeAudioAndRender, { passive: true });

    function injectFileHook(inputNode) {
        if (inputNode._hooked) return;
        inputNode._hooked = true;
        inputNode.setAttribute('accept', '.state,.sav,.srm,*/*');

        inputNode.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(evt) {
                try {
                    const buffer = new Uint8Array(evt.target.result);
                    const fileName = file.name.toLowerCase();

                    if (fileName.endsWith('.state')) {
                        // 触发原生的 loadState 逻辑。
                        // EmulatorJS 的 loadState 通常期望的是解压后的 state，但如果这里直接塞 Uint8Array 失效，
                        // 我们必须依赖其原生 UI 的回调，或者在 input 上触发原生事件处理
                        // 这里我们使用一种技巧：将数据暂存，然后尝试通过官方 API 加载
                        if(window.EJS_emulator && window.EJS_emulator.loadState) {
                            window.EJS_emulator.loadState(buffer);
                        } else {
                            alert("当前核心版本暂未暴露 loadState API。");
                        }
                    } else if (fileName.endsWith('.sav') || fileName.endsWith('.srm')) {
                        // 处理电池存档：写入虚拟文件系统 (FS)
                        if (window.EJS_emulator && window.EJS_emulator.FS) {
                            const saveDir = '/home/web_user/retroarch/userdata/saves';
                            const baseName = romFile.replace(/\.[^/.]+$/, "");
                            const targetPath = `${saveDir}/${baseName}.srm`; // RetroArch 通常认 .srm

                            try {
                                // 强制创建目录
                                window.EJS_emulator.FS.mkdirTree(saveDir);
                                window.EJS_emulator.FS.writeFile(targetPath, buffer);

                                // 强制同步至 IndexedDB
                                window.EJS_emulator.FS.syncfs(false, (err) => {
                                    if(err) throw err;
                                    if (confirm('已成功导入游戏内存档。需重启游戏方可生效，是否立即重启？')) {
                                        window.location.reload();
                                    }
                                });
                            } catch(fsErr) {
                                console.error("写入 FS 失败", fsErr);
                                alert("存档写入失败，可能是文件系统未就绪。");
                            }
                        } else {
                            alert("模拟器文件系统未就绪，请稍后再试。");
                        }
                    }

                    // 延迟恢复以防卡死
                    setTimeout(resumeAudioAndRender, 300);

                } catch(err) {
                    console.error('[Hook] 导入出错:', err);
                }
            };
            reader.readAsArrayBuffer(file);
        }, true);
    }

    const observer = new MutationObserver((mutations) => {
        for (let m of mutations) {
            for (let node of m.addedNodes) {
                if (node.tagName === 'INPUT' && node.type === 'file') {
                    injectFileHook(node);
                } else if (node.querySelectorAll) {
                    node.querySelectorAll('input[type="file"]').forEach(injectFileHook);
                }
            }
        }
    });
    observer.observe(document.documentElement, { childList: true, subtree: true });


    // =========================================================================
    // 4. 启动加载序列
    // =========================================================================
    async function startEmulator() {
        // EmulatorJS 的底层支持将 IndexedDB 挂载为 /home/web_user/retroarch/userdata
        // 这个动作由 EJS 核心内部完成。我们只需确保加载器顺利执行。

        const loaderScript = document.createElement('script');
        loaderScript.src = '../emulator_data/loader.js';
        loaderScript.onload = () => {
            initFSSync();
            if (window.parent) window.parent.postMessage('emulator-ready', '*');
        };
        document.body.appendChild(loaderScript);
    }

    startEmulator();

</script>
</body>
</html>
