<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tukuai Emulator Core</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4ade80;
            font-family: monospace;
            overscroll-behavior: none;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }
        #game-container {
            width: 100%;
            height: 100%;
        }

        #focus-hint {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #4ade80;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 12px;
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 4px 15px rgba(74, 222, 128, 0.2);
            animation: fadeout 1s forwards;
            animation-delay: 6s;
        }
        @keyframes fadeout {
            to { opacity: 0; visibility: hidden; transform: translate(-50%, -10px); }
        }
    </style>
</head>
<body>

<div id="focus-hint">💡 提示：按键无反应请先【点击游戏画面】<br><span style="color:#94a3b8; font-size:10px;">祝您玩的开心</span></div>

<div id="game-container">
    <div id="game"></div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const romFile = urlParams.get('rom');
    const coreParam = urlParams.get('core');

    if (!romFile) {
        document.body.innerHTML = `
            <div style="text-align:center; line-height: 2;">
                <div style="font-size: 3rem; margin-bottom: 1rem;">⚠️</div>
                <h3>SYSTEM ERROR: NO ROM DETECTED</h3>
                <p style="color: #64748b; font-size: 12px;">Missing "?rom=filename" parameter in URL.</p>
            </div>
        `;
    } else {
        window.EJS_player = '#game';

        let core = 'gba';
        if (coreParam) {
            core = coreParam;
        } else {
            const ext = romFile.split('.').pop().toLowerCase();
            if (ext === 'sfc' || ext === 'smc') {
                core = 'snes';
            } else if (ext === 'nes') {
                core = 'nes';
            } else if (ext === 'gb' || ext === 'gbc') {
                core = 'gb';
            }
        }
        window.EJS_core = core;
        window.EJS_gameName = romFile;
        window.EJS_language = 'zh-CN';

        window.EJS_gameUrl = '../rom/' + romFile;
        window.EJS_pathtodata = '../emulator_data/';

        let uniqueGameID = 0;
        for (let i = 0; i < romFile.length; i++) {
            uniqueGameID = ((uniqueGameID << 5) - uniqueGameID) + romFile.charCodeAt(i);
            uniqueGameID |= 0;
        }
        window.EJS_gameID = Math.abs(uniqueGameID);

        window.EJS_color = '#000000';
        window.EJS_startOnLoaded = true;

        window.EJS_VirtualGamepadSettings = {
            alpha: 0.5,
            scale: 1.1
        };

        window.EJS_Buttons = {
            playPause: true,
            restart: true,
            mute: true,
            settings: true,
            fullscreen: true,
            saveState: true,
            loadState: true
        };

        window.EJS_onGameStart = function() {
            window.focus();
            setTimeout(() => {
                const canvas = document.querySelector('#game canvas');
                if (canvas) canvas.focus();
            }, 500);
        };
    }

    // =========================================================================
    // 1. 本地存储底座 (IndexedDB)
    // =========================================================================
    const SAVE_KEY_BATTERY = 'battery_sav_' + romFile;

    function getSavesDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open('tukuai_game_saves_db', 1);
            request.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('saves')) {
                    db.createObjectStore('saves');
                }
            };
            request.onsuccess = (e) => resolve(e.target.result);
            request.onerror = (e) => reject(e);
        });
    }

    async function setSaveToDB(key, data) {
        const db = await getSavesDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction('saves', 'readwrite');
            tx.objectStore('saves').put(data, key);
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
        });
    }

    async function getSaveFromDB(key) {
        const db = await getSavesDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction('saves', 'readonly');
            const req = tx.objectStore('saves').get(key);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    }

    // =========================================================================
    // 2. 底层 WASM 核心与虚拟文件系统探测器
    // =========================================================================
    function getCore() {
        const mod = (window.EJS_emulator && window.EJS_emulator.gameManager && window.EJS_emulator.gameManager.Module)
            || window.Module
            || (typeof Module !== 'undefined' ? Module : null);
        const fs = (mod && mod.FS)
            || window.FS
            || (window.EJS_emulator && window.EJS_emulator.FS)
            || (typeof FS !== 'undefined' ? FS : null);
        return { mod, fs };
    }

    function getSRAMData() {
        const { mod, fs } = getCore();
        if (!fs) return null;

        // 强迫 RetroArch 将内存里的 SRAM 刷入虚拟磁盘
        if (mod && typeof mod._cmd_save_files === 'function') {
            try { mod._cmd_save_files(); } catch(e) {}
        }
        if (window.EJS_emulator && typeof window.EJS_emulator.saveSave === 'function') {
            try { window.EJS_emulator.saveSave(); } catch(e) {}
        }

        // 检索 RetroArch 默认存储路径下的 .srm 与 .sav 文件
        const saveDir = '/home/web_user/retroarch/userdata/saves';
        try {
            const files = fs.readdir(saveDir);
            for (const f of files) {
                if (f === '.' || f === '..') continue;
                if (f.endsWith('.srm') || f.endsWith('.sav')) {
                    const data = fs.readFile(saveDir + '/' + f);
                    if (data && data.length > 0) return data;
                }
            }
        } catch(e) {}

        // 兜底：检索根目录
        const base = romFile.replace(/\.[^/.]+$/, "");
        const fallbacks = [`/${base}.srm`, `/${base}.sav`, `/${romFile}.srm`, `/${romFile}.sav`];
        for (const p of fallbacks) {
            try {
                const data = fs.readFile(p);
                if (data && data.length > 0) return data;
            } catch(e) {}
        }

        return null;
    }

    function calculateChecksum(buffer) {
        let sum = 0;
        const step = Math.max(1, Math.floor(buffer.length / 1000));
        for (let i = 0; i < buffer.length; i += step) {
            sum = (sum + buffer[i]) | 0;
        }
        return sum;
    }

    let lastSaveChecksum = 0;
    async function syncSaveToStorage() {
        try {
            const sram = getSRAMData();
            if (!sram || sram.length === 0) return;

            const checksum = calculateChecksum(sram);
            // 校验到真实数据变化时才写入本地持久库
            if (checksum !== 0 && checksum !== lastSaveChecksum) {
                lastSaveChecksum = checksum;
                await setSaveToDB(SAVE_KEY_BATTERY, sram);
                console.log('[AutoSave] 游戏内部卡带存档已持久化至手机本地，大小:', sram.length);
            }
        } catch(e) {
            console.warn('[AutoSave] 存盘异常:', e);
        }
    }

    // =========================================================================
    // 3. 守护定时器与生命周期挂钩
    // =========================================================================
    setInterval(syncSaveToStorage, 3000);

    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === 'hidden') syncSaveToStorage();
    });
    window.addEventListener("pagehide", syncSaveToStorage);
    window.addEventListener('beforeunload', syncSaveToStorage);

    window.addEventListener('message', async (event) => {
        if (event.data === 'focus-emulator') {
            const canvas = document.querySelector('canvas');
            if (canvas) {
                canvas.setAttribute('tabindex', '0');
                canvas.focus();
            }
        }
        if (event.data === 'save-before-close') {
            await syncSaveToStorage();
        }
    });

    function unlockAudio() {
        if (window.EJS_emulator && window.EJS_emulator.audioContext) {
            if (window.EJS_emulator.audioContext.state === 'suspended') {
                window.EJS_emulator.audioContext.resume();
            }
        }
    }
    window.addEventListener('touchstart', unlockAudio, { passive: true });
    window.addEventListener('touchend', unlockAudio, { passive: true });

    // 原生文件导入劫持 (自动兼容 .sav 并解决移动端选完文件假死)
    function hookFileInput(input) {
        if (input._hooked) return;
        input._hooked = true;
        input.setAttribute('accept', '.state,.sav,.srm,*/*');

        input.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(evt) {
                try {
                    const buffer = new Uint8Array(evt.target.result);
                    const fileName = file.name.toLowerCase();

                    if (fileName.endsWith('.sav') || fileName.endsWith('.srm') || buffer.length <= 262144) {
                        await setSaveToDB(SAVE_KEY_BATTERY, buffer);
                        alert('已成功将外部电池存档导入缓存！页面即将重新加载以载入进度。');
                        window.location.reload();
                    } else {
                        if (window.EJS_emulator && window.EJS_emulator.gameManager) {
                            if (typeof window.EJS_emulator.gameManager.loadState === 'function') {
                                window.EJS_emulator.gameManager.loadState(buffer);
                            }
                        }
                    }
                    setTimeout(() => {
                        unlockAudio();
                        if (window.EJS_emulator && window.EJS_emulator.gameManager) {
                            if (typeof window.EJS_emulator.gameManager.resume === 'function') {
                                window.EJS_emulator.gameManager.resume();
                            }
                        }
                    }, 200);
                } catch(err) {
                    console.error('[Hook] 导入出错:', err);
                }
            };
            reader.readAsArrayBuffer(file);
        }, true);
    }

    const domObserver = new MutationObserver((mutations) => {
        for (let m of mutations) {
            for (let node of m.addedNodes) {
                if (node.tagName === 'INPUT' && node.type === 'file') {
                    hookFileInput(node);
                } else if (node.querySelectorAll) {
                    node.querySelectorAll('input[type="file"]').forEach(hookFileInput);
                }
            }
        }
    });
    domObserver.observe(document.documentElement, { childList: true, subtree: true });

    // =========================================================================
    // 4. 核心执行入口：开机前从 IndexedDB 取档并注入 EJS_loadSaveURL
    // =========================================================================
    async function bootSystem() {
        try {
            const cachedSave = await getSaveFromDB(SAVE_KEY_BATTERY);
            if (cachedSave && cachedSave.length > 0) {
                // 关键点：在 loader.js 执行前挂载原生读档地址，开机直接识别到 CONTINUE
                const blob = new Blob([cachedSave], { type: 'application/octet-stream' });
                window.EJS_loadSaveURL = URL.createObjectURL(blob);
                console.log('[AutoLoad] 成功从 IndexedDB 装载历史电池存档至 EJS_loadSaveURL，大小:', cachedSave.length);
            }
        } catch(e) {
            console.warn('[AutoLoad] 预读存档失败:', e);
        }

        // 动态加载模拟器引擎
        const loader = document.createElement('script');
        loader.src = '../emulator_data/loader.js';
        loader.onload = () => {
            if (window.parent) window.parent.postMessage('emulator-ready', '*');
        };
        document.body.appendChild(loader);
    }

    bootSystem();
</script>
</body>
</html>
