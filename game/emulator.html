<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tukuai Emulator Core</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4ade80;
            font-family: monospace;
        }
        #game-container {
            width: 100%;
            height: 100%;
        }
        /* 友好的提示小条，过几秒自动消失 */
        #focus-hint {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #4ade80;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            pointer-events: none;
            z-index: 9999;
            animation: fadeout 4s forwards;
            animation-delay: 3s;
        }
        @keyframes fadeout {
            to { opacity: 0; visibility: hidden; }
        }
    </style>
</head>
<body>

    <div id="focus-hint">💡 提示：按键无反应请先【点击游戏画面】。</div>

    <div id="game-container">
        <div id="game"></div>
    </div>
    <!-- 在 game-container 同级添加一个原生的导入按钮 -->
    <div id="native-import-btn" style="position: absolute; bottom: 20px; right: 20px; z-index: 9999;">
        <!-- 透明的文件选择器盖在按钮上方 -->
        <input type="file" id="rom-save-upload" accept=".sav,.state" style="opacity: 0; position: absolute; width: 100%; height: 100%; z-index: 2;">
        <button style="background: rgba(168, 85, 247, 0.8); border: 1px solid #fff; color: #fff; padding: 5px 15px; border-radius: 20px; font-family: monospace;">
            📁 导入存档
        </button>
    </div>

    <script>
        // 监听原生文件选择器的变化，将文件喂给模拟器
        document.getElementById('rom-save-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            // 调用 EmulatorJS 暴露的底层文件处理 API
            // （需根据具体的 EmulatorJS 版本 API 进行适配，通常内置在 EJS_emulator 对象中）
            if (window.EJS_emulator && window.EJS_emulator.gameManager) {
                console.log("正在通过原生 DOM 注入存档文件:", file.name);
                // 将文件传入模拟器状态管理
                // window.EJS_emulator.gameManager.loadState(file);
            }
        });
    </script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const romFile = urlParams.get('rom');
        const coreParam = urlParams.get('core');

        if (!romFile) {
            document.body.innerHTML = `
                <div style="text-align:center; line-height: 2;">
                    <div style="font-size: 3rem; margin-bottom: 1rem;">⚠️</div>
                    <h3>SYSTEM ERROR: NO ROM DETECTED</h3>
                    <p style="color: #64748b; font-size: 12px;">Missing "?rom=filename" parameter in URL.</p>
                </div>
            `;
        } else {
            window.EJS_player = '#game';

            // 动态判断模拟器核心
            let core = 'gba';
            if (coreParam) {
                core = coreParam;
            } else {
                const ext = romFile.split('.').pop().toLowerCase();
                if (ext === 'sfc' || ext === 'smc') {
                    core = 'snes';
                } else if (ext === 'nes') {
                    core = 'nes';
                } else if (ext === 'gb' || ext === 'gbc') {
                    core = 'gb';
                }
            }
            window.EJS_core = core;
            window.EJS_gameName = romFile;
            window.EJS_language = 'en';

            // 确保你的 GitHub 仓库中有对应的 rom 文件夹和文件
            window.EJS_gameUrl = '../rom/' + romFile;
            window.EJS_pathtodata = '../emulator_data/';

            window.EJS_color = '#000000';
            window.EJS_startOnLoaded = true;

            // 确保开启了 settings，这样才能呼出原生菜单进行存档管理
            window.EJS_Buttons = {
                playPause: false,
                restart: true,
                mute: true,
                settings: true,
                fullscreen: false
            };

            // 游戏启动完毕后，强制抢夺系统键盘焦点
            window.EJS_onGameStart = function() {
                console.log("[Emulator Core] 游戏已启动，正在获取焦点...");
                window.focus();
                setTimeout(() => {
                    const canvas = document.querySelector('#game canvas');
                    if(canvas) {
                        canvas.focus();
                    }
                }, 500);
            };
        }
    </script>

    <script src="../emulator_data/loader.js"></script>

    <script>
        // 跨窗口通信监听 (针对 iframe 嵌套优化)
        window.addEventListener('message', (event) => {
            if (event.data === 'focus-emulator') {
                const canvas = document.querySelector('canvas');
                if (canvas) {
                    canvas.setAttribute('tabindex', '0');
                    canvas.focus();
                }
            }
        });

        // 页面加载完成后，告诉父级 iframe 窗口自己准备好了
        window.addEventListener('load', () => {
            if (window.parent) {
                window.parent.postMessage('emulator-ready', '*');
            }
        });
    </script>
</body>
</html>
