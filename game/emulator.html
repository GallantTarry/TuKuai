<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tukuai Emulator Core</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4ade80;
            font-family: monospace;
            overscroll-behavior: none;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }
        #game-container {
            width: 100%;
            height: 100%;
        }

        #focus-hint {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #4ade80;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 12px;
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 4px 15px rgba(74, 222, 128, 0.2);
            animation: fadeout 1s forwards;
            animation-delay: 6s;
        }
        @keyframes fadeout {
            to { opacity: 0; visibility: hidden; transform: translate(-50%, -10px); }
        }
    </style>
</head>
<body>

<div id="focus-hint">💡 提示：按键无反应请先【点击游戏画面】<br><span style="color:#94a3b8; font-size:10px;">祝您玩的开心</span></div>

<div id="game-container">
    <div id="game"></div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const romFile = urlParams.get('rom');
    const coreParam = urlParams.get('core');

    if (!romFile) {
        document.body.innerHTML = `
                <div style="text-align:center; line-height: 2;">
                    <div style="font-size: 3rem; margin-bottom: 1rem;">⚠️</div>
                    <h3>SYSTEM ERROR: NO ROM DETECTED</h3>
                    <p style="color: #64748b; font-size: 12px;">Missing "?rom=filename" parameter in URL.</p>
                </div>
            `;
    } else {
        window.EJS_player = '#game';

        let core = 'gba';
        if (coreParam) {
            core = coreParam;
        } else {
            const ext = romFile.split('.').pop().toLowerCase();
            if (ext === 'sfc' || ext === 'smc') {
                core = 'snes';
            } else if (ext === 'nes') {
                core = 'nes';
            } else if (ext === 'gb' || ext === 'gbc') {
                core = 'gb';
            }
        }
        window.EJS_core = core;
        window.EJS_gameName = romFile;
        window.EJS_language = 'zh-CN';

        window.EJS_gameUrl = '../rom/' + romFile;
        window.EJS_pathtodata = '../emulator_data/';

        let uniqueGameID = 0;
        for (let i = 0; i < romFile.length; i++) {
            uniqueGameID = ((uniqueGameID << 5) - uniqueGameID) + romFile.charCodeAt(i);
            uniqueGameID |= 0;
        }
        window.EJS_gameID = Math.abs(uniqueGameID);

        window.EJS_color = '#000000';
        window.EJS_startOnLoaded = true;

        window.EJS_VirtualGamepadSettings = {
            alpha: 0.5,
            scale: 1.1
        };

        window.EJS_Buttons = {
            playPause: true,
            restart: true,
            mute: true,
            settings: true,
            fullscreen: true,
            saveState: true,
            loadState: true
        };

        function forceSyncSave() {
            try {
                if (window.EJS_emulator && window.EJS_emulator.gameManager) {
                    if (typeof window.EJS_emulator.gameManager.saveSave === 'function') {
                        window.EJS_emulator.gameManager.saveSave();
                    }
                    if (window.EJS_emulator.gameManager.FS && window.EJS_emulator.gameManager.FS.syncfs) {
                        window.EJS_emulator.gameManager.FS.syncfs(false, function (err) {
                            if (err) {
                                console.error("[Emulator Core] 存档写入 IndexedDB 失败:", err);
                            } else {
                                console.log("[Emulator Core] 存档已成功持久化至本地 IndexedDB！");
                            }
                        });
                    }
                }
            } catch (e) {
                console.warn("[Emulator Core] 自动存盘异常:", e);
            }
        }

        document.addEventListener("visibilitychange", function() {
            if (document.visibilityState === 'hidden') {
                forceSyncSave();
            }
        });

        window.addEventListener("pagehide", forceSyncSave);

        window.addEventListener('beforeunload', function (e) {
            forceSyncSave();
            const confirmationMessage = '游戏可能正在保存进度，确定要强制退出吗？';
            e.returnValue = confirmationMessage;
            return confirmationMessage;
        });

        window.EJS_onGameStart = function() {
            window.focus();
            setTimeout(() => {
                const canvas = document.querySelector('#game canvas');
                if(canvas) {
                    canvas.focus();
                }
            }, 500);
        };
    }
</script>

<script src="../emulator_data/loader.js"></script>

<script>
    // 1. 跨窗口通信与音频防卡死
    window.addEventListener('message', (event) => {
        if (event.data === 'focus-emulator') {
            const canvas = document.querySelector('canvas');
            if (canvas) {
                canvas.setAttribute('tabindex', '0');
                canvas.focus();
            }
        }
        if (event.data === 'save-before-close') {
            if (typeof forceSyncSave === 'function') forceSyncSave();
        }
    });

    function unlockAudio() {
        if (window.EJS_emulator && window.EJS_emulator.audioContext) {
            if (window.EJS_emulator.audioContext.state === 'suspended') {
                window.EJS_emulator.audioContext.resume();
            }
        }
    }
    window.addEventListener('touchstart', unlockAudio, { passive: true });
    window.addEventListener('touchend', unlockAudio, { passive: true });

    // =========================================================================
    // 2. 原生底层劫持：绑定原生“加载状态”与文件选择器
    // =========================================================================
    function getSavesDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open('tukuai_game_saves_db', 1);
            request.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('saves')) {
                    db.createObjectStore('saves');
                }
            };
            request.onsuccess = (e) => resolve(e.target.result);
            request.onerror = (e) => reject(e);
        });
    }

    async function setSaveToDB(key, data) {
        const db = await getSavesDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction('saves', 'readwrite');
            tx.objectStore('saves').put(data, key);
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
        });
    }

    async function getSaveFromDB(key) {
        const db = await getSavesDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction('saves', 'readonly');
            const req = tx.objectStore('saves').get(key);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    }

    const SAVE_KEY_BATTERY = 'battery_sav_' + romFile;

    // 核心拦截：只要原生 EmulatorJS 动态创建 <input type="file">，立刻接管
    function hookFileInput(input) {
        if (input._hooked) return;
        input._hooked = true;

        // 强行放开限制，让玩家在手机上既能选 .state，也能选 .sav 电池存档
        input.setAttribute('accept', '.state,.sav,.srm,*/*');

        input.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(evt) {
                try {
                    const buffer = new Uint8Array(evt.target.result);
                    const fileName = file.name.toLowerCase();

                    // 判定 A：如果玩家选的是电池存档 (.sav/.srm) 或者小于 256KB 的原始卡带存档
                    if (fileName.endsWith('.sav') || fileName.endsWith('.srm') || buffer.length <= 262144) {
                        await setSaveToDB(SAVE_KEY_BATTERY, buffer);
                        if (window.EJS_emulator && window.EJS_emulator.gameManager) {
                            if (typeof window.EJS_emulator.gameManager.loadSave === 'function') {
                                window.EJS_emulator.gameManager.loadSave(buffer);
                            }
                            if (confirm('识别到游戏内存档（.sav），已载入缓存！需重启核心生效，是否立即重启？')) {
                                window.EJS_emulator.gameManager.restart();
                            }
                        }
                    }
                    // 判定 B：如果是即时快照 (.state)
                    else {
                        if (window.EJS_emulator && window.EJS_emulator.gameManager) {
                            if (typeof window.EJS_emulator.gameManager.loadState === 'function') {
                                window.EJS_emulator.gameManager.loadState(buffer);
                            }
                        }
                    }

                    // 核心关键：手机选完文件切回网页后，强行踢醒音频与渲染管线，杜绝卡死
                    setTimeout(() => {
                        unlockAudio();
                        if (window.EJS_emulator && window.EJS_emulator.gameManager) {
                            if (typeof window.EJS_emulator.gameManager.resume === 'function') {
                                window.EJS_emulator.gameManager.resume();
                            }
                        }
                    }, 200);

                } catch(err) {
                    console.error('[NativeHook] 读取存档出错:', err);
                }
            };
            reader.readAsArrayBuffer(file);
        }, true);
    }

    // 监听 DOM 树，自动捕获原生 EmulatorJS 注入的文件选择器
    const domObserver = new MutationObserver((mutations) => {
        for (let m of mutations) {
            for (let node of m.addedNodes) {
                if (node.tagName === 'INPUT' && node.type === 'file') {
                    hookFileInput(node);
                } else if (node.querySelectorAll) {
                    node.querySelectorAll('input[type="file"]').forEach(hookFileInput);
                }
            }
        }
    });
    domObserver.observe(document.documentElement, { childList: true, subtree: true });

    // =========================================================================
    // 3. 游戏内存档无感守护：游戏里按“保存”，后台自动存进手机 IndexedDB
    // =========================================================================
    let lastSaveChecksum = 0;
    setInterval(() => {
        if (!window.EJS_emulator || !window.EJS_emulator.gameManager) return;
        try {
            if (typeof window.EJS_emulator.gameManager.saveSave === 'function') {
                window.EJS_emulator.gameManager.saveSave();
            }
            if (typeof window.EJS_emulator.gameManager.getSave === 'function') {
                const currentData = window.EJS_emulator.gameManager.getSave();
                if (currentData && currentData.length > 0) {
                    let sum = 0;
                    for (let i = 0; i < Math.min(currentData.length, 1000); i++) {
                        sum += currentData[i];
                    }
                    // 检测到数据有变化，静默同步到手机永久磁盘
                    if (sum !== 0 && sum !== lastSaveChecksum) {
                        lastSaveChecksum = sum;
                        setSaveToDB(SAVE_KEY_BATTERY, currentData);
                        console.log('[AutoSave] 游戏内部保存已自动同步至手机缓存');
                    }
                }
            }
        } catch (e) {}
    }, 3000);

    // =========================================================================
    // 4. 开机自动注入：只要进游戏，自动加载上次在手机里的存档
    // =========================================================================
    const originalOnGameStart = window.EJS_onGameStart;
    window.EJS_onGameStart = function() {
        if (typeof originalOnGameStart === 'function') originalOnGameStart();

        setTimeout(async () => {
            try {
                const cachedSave = await getSaveFromDB(SAVE_KEY_BATTERY);
                if (cachedSave && cachedSave.length > 0 && window.EJS_emulator && window.EJS_emulator.gameManager) {
                    if (typeof window.EJS_emulator.gameManager.loadSave === 'function') {
                        window.EJS_emulator.gameManager.loadSave(cachedSave);
                        console.log('[AutoLoad] 已自动从手机缓存还原上次游戏内存档！');
                    }
                }
            } catch (e) {
                console.warn('[AutoLoad] 自动装载失败:', e);
            }
        }, 1000);
    };

    window.addEventListener('load', () => {
        if (window.parent) window.parent.postMessage('emulator-ready', '*');
    });
</script>
</body>
</html>
