<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EmulatorJS Core</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: monospace;
            overscroll-behavior: none;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<div id="game"></div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const romFile = urlParams.get('rom');
    const coreParam = urlParams.get('core');

    if (!romFile) {
        document.body.innerHTML = `
            <div style="text-align:center; color: #4ade80; line-height: 2;">
                <div style="font-size: 3rem; margin-bottom: 1rem;">⚠️</div>
                <h3>SYSTEM ERROR: NO ROM DETECTED</h3>
                <p style="color: #64748b; font-size: 12px;">Missing "?rom=filename" parameter in URL.</p>
            </div>
        `;
    } else {
        let core = coreParam || 'gba';
        if (!coreParam) {
            const ext = romFile.split('.').pop().toLowerCase();
            if (ext === 'sfc' || ext === 'smc') core = 'snes';
            else if (ext === 'nes') core = 'nes';
            else if (ext === 'gb' || ext === 'gbc') core = 'gb';
        }

        // =========================================================================
        // 为每个游戏计算独立的唯一 ID，防止存档串区
        // =========================================================================
        let romHash = 0;
        for (let i = 0; i < romFile.length; i++) {
            romHash = (romHash << 5) - romHash + romFile.charCodeAt(i);
            romHash |= 0;
        }
        window.EJS_gameID = Math.abs(romHash);

        // =========================================================================
        // 极简纯净配置区（剥离所有自动化存档与强制数据库设定）
        // =========================================================================
        window.EJS_player = '#game';
        window.EJS_core = core;
        window.EJS_gameName = romFile;
        window.EJS_language = 'zh-CN';
        window.EJS_color = '#4ade80';
        window.EJS_startOnLoaded = true;

        window.EJS_pathtodata = '../emulator_data/';
        window.EJS_gameUrl = '../rom/' + romFile;

        window.EJS_VirtualGamepadSettings = { alpha: 0.5, scale: 1.1 };
        window.EJS_Buttons = {
            playPause: true, restart: true, mute: true, settings: true,
            fullscreen: true, saveState: true, loadState: true
        };

        // 仅保留基础的加载完毕通知逻辑
        window.EJS_onGameStart = function() {
            // 👇 新增：先为游戏所在的 iframe 独立引入像素字体 👇
            if (!document.getElementById('pixel-font-style')) {
                const style = document.createElement('style');
                style.id = 'pixel-font-style';
                // 注意相对路径：因为当前在 /game/emulator.html，所以要用 ../ 退回上一级
                style.innerHTML = `
                    @font-face {
                        font-family: 'ChinesePixel';
                        src: url('../font/zpix.ttf') format('truetype');
                        font-weight: normal;
                        font-style: normal;
                    }
                `;
                document.head.appendChild(style);
            }
            // 👆 字体引入结束 👆

            const popup = document.createElement('div');
            popup.innerHTML = '✨ 土块祝您玩的开心！';

            // 为弹窗赋予符合你系统的玻璃拟态和赛博朋克样式
            popup.style.cssText = `
                position: absolute;
                top: 20px;
                left: 50%;
                transform: translateX(-50%) translateY(-20px);
                background: rgba(15, 20, 30, 0.85);
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
                color: #4ade80;
                padding: 12px 24px;
                border: 1px solid rgba(74, 222, 128, 0.4);
                border-radius: 12px;
                /* 👇 字体修改区 👇 */
                font-family: 'ChinesePixel', monospace;
                font-size: 16px; /* 像素字体稍微调大点会更清晰 */
                font-weight: normal; /* 必须去掉 bold，否则像素边缘会发虚变糊 */
                /* 👆 字体修改结束 👆 */
                letter-spacing: 2px;
                z-index: 9999;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8), 0 0 15px rgba(74, 222, 128, 0.2);
                pointer-events: none; /* 防止遮挡用户点击游戏界面的操作 */
                opacity: 0;
                transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            `;
            document.body.appendChild(popup);

            // 第一阶段：触发动画，让它向下浮现并完全显示
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    popup.style.opacity = '1';
                    popup.style.transform = 'translateX(-50%) translateY(0)';
                });
            });

            // 第二阶段：3.5秒后自动渐隐并销毁 DOM 节点，不留垃圾
            setTimeout(() => {
                popup.style.opacity = '0';
                popup.style.transform = 'translateX(-50%) translateY(-20px)';
                setTimeout(() => popup.remove(), 600);
            }, 3500);
            // 👆 新增结束 👆
        };

        const loaderScript = document.createElement('script');
        loaderScript.src = window.EJS_pathtodata + 'loader.js';
        document.body.appendChild(loaderScript);
    }
</script>
</body>
</html>
