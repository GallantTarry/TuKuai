<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tukuai Emulator Core</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4ade80;
            font-family: monospace;
        }
        #game-container {
            width: 100%;
            height: 100%;
        }
        /* 友好的提示小条，过几秒自动消失 */
        #focus-hint {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #4ade80;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            pointer-events: none;
            z-index: 9999;
            animation: fadeout 4s forwards;
            animation-delay: 3s;
        }
        @keyframes fadeout {
            to { opacity: 0; visibility: hidden; }
        }
    </style>
</head>
<body>

    <div id="focus-hint">💡 提示：按键无反应请先【点击游戏画面】。</div>

    <div id="game-container">
        <div id="game"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const romFile = urlParams.get('rom');
        const coreParam = urlParams.get('core');

        if (!romFile) {
            document.body.innerHTML = `
                <div style="text-align:center; line-height: 2;">
                    <div style="font-size: 3rem; margin-bottom: 1rem;">⚠️</div>
                    <h3>SYSTEM ERROR: NO ROM DETECTED</h3>
                    <p style="color: #64748b; font-size: 12px;">Missing "?rom=filename" parameter in URL.</p>
                </div>
            `;
        } else {
            window.EJS_player = '#game';

            // 动态判断模拟器核心
            let core = 'gba';
            if (coreParam) {
                core = coreParam;
            } else {
                const ext = romFile.split('.').pop().toLowerCase();
                if (ext === 'sfc' || ext === 'smc') {
                    core = 'snes';
                } else if (ext === 'nes') {
                    core = 'nes';
                } else if (ext === 'gb' || ext === 'gbc') {
                    core = 'gb';
                }
            }
            window.EJS_core = core;
            window.EJS_gameName = romFile;
            window.EJS_language = 'en';

            // 确保你的 GitHub 仓库中有对应的 rom 文件夹和文件
            window.EJS_gameUrl = '../rom/' + romFile;
            window.EJS_pathtodata = '../emulator_data/';

            window.EJS_color = '#000000';
            window.EJS_startOnLoaded = true;

            // 确保开启了 settings，这样才能呼出原生菜单进行存档管理
            window.EJS_Buttons = {
                playPause: false,
                restart: true,
                mute: true,
                settings: true,
                fullscreen: false
            };

            // 游戏启动完毕后，强制抢夺系统键盘焦点
            window.EJS_onGameStart = function() {
                console.log("[Emulator Core] 游戏已启动，正在获取焦点...");
                window.focus();
                setTimeout(() => {
                    const canvas = document.querySelector('#game canvas');
                    if(canvas) {
                        canvas.focus();
                    }
                }, 500);
            };
        }
    </script>

    <script src="../emulator_data/loader.js"></script>

    <script>
        document.getElementById('state-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            console.log("[Emulator] 准备解析即时存档 (State):", file.name);

            const reader = new FileReader();
            reader.onload = function(event) {
                const stateData = new Uint8Array(event.target.result);

                if (window.EJS_emulator) {
                    // 1. 强制抢夺焦点，唤醒 iframe 引擎
                    window.focus();

                    // 2. 如果模拟器内部处于暂停状态，强制让它先跑起来
                    if (window.EJS_emulator.gameManager && typeof window.EJS_emulator.gameManager.resume === 'function') {
                        window.EJS_emulator.gameManager.resume();
                    }

                    // 3. 延时 100 毫秒，等引擎的主循环 (Loop) 跑通一帧后，再灌入庞大的快照数据
                    setTimeout(() => {
                        try {
                            if (window.EJS_emulator.gameManager && typeof window.EJS_emulator.gameManager.loadState === 'function') {
                                window.EJS_emulator.gameManager.loadState(stateData);
                            } else if (typeof window.EJS_emulator.loadState === 'function') {
                                window.EJS_emulator.loadState(stateData);
                            }
                            console.log("[Emulator] State 注入成功，引擎恢复运转！");
                        } catch (err) {
                            console.error("[Emulator] State 注入失败:", err);
                        }
                    }, 100);
                }
            };

            reader.readAsArrayBuffer(file);
            e.target.value = ''; // 防死锁：允许连续导入同一个文件
        });
    </script>
</body>
</html>
