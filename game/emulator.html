<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tukuai Emulator Core</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4ade80;
            font-family: monospace;
        }
        #game-container {
            width: 100%;
            height: 100%;
        }
        /* 友好的提示小条，过几秒自动消失 */
        #focus-hint {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #4ade80;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            pointer-events: none;
            z-index: 9999;
            animation: fadeout 4s forwards;
            animation-delay: 3s;
        }
        @keyframes fadeout {
            to { opacity: 0; visibility: hidden; }
        }
    </style>
</head>
<body>

<div id="focus-hint">💡 提示：按键无反应请先【点击游戏画面】。</div>

<div id="game-container">
    <div id="game"></div>
</div>

<!-- 极简透明版 State 导入按钮 -->
<div id="native-import-btn" style="position: absolute; bottom: 10px; right: 10px; z-index: 9999; opacity: 0.6; transition: opacity 0.3s;">
    <!-- 💥 修复1：移除了 accept 属性，防止 iOS 将存档文件置灰无法选中 💥 -->
    <input type="file" id="state-upload" style="opacity: 0; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; cursor: pointer;">
    <button style="background: transparent; border: 1px solid rgba(255, 255, 255, 0.3); color: rgba(255, 255, 255, 0.6); padding: 4px 8px; border-radius: 4px; font-size: 10px; font-family: monospace; pointer-events: none;">
        LOAD STATE
    </button>
</div>

<script>
    const uploadInput = document.getElementById('state-upload');

    // 💥 修复2：在手机弹窗前，主动把模拟器挂起，防止切入后台时引擎继续裸奔 💥
    uploadInput.addEventListener('click', function() {
        if (window.EJS_emulator) {
            try {
                if (window.EJS_emulator.gameManager && typeof window.EJS_emulator.gameManager.pause === 'function') {
                    window.EJS_emulator.gameManager.pause();
                } else if (typeof window.EJS_emulator.pause === 'function') {
                    window.EJS_emulator.pause();
                }
            } catch(e) {}
        }
    });

    // 选中文件后的处理
    uploadInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) {
            resumeEmulator(); // 没选文件，恢复运行
            return;
        }

        // 在 JS 代码中进行后缀拦截，代替 HTML 的 accept
        if (!file.name.toLowerCase().endsWith('.state')) {
            alert("请选择 .state 格式的即时存档文件！");
            e.target.value = '';
            resumeEmulator();
            return;
        }

        console.log("[Emulator] 正在解析即时存档 (State):", file.name);

        // 💥 修复3：核心！给手机浏览器留出 500 毫秒的“苏醒时间” 💥
        // 让 WebGL 和 AudioContext 完全恢复后，再进行重体力内存读写
        setTimeout(() => {
            const reader = new FileReader();
            reader.onload = function(event) {
                const stateData = new Uint8Array(event.target.result);

                if (window.EJS_emulator) {
                    try {
                        if (window.EJS_emulator.gameManager && typeof window.EJS_emulator.gameManager.loadState === 'function') {
                            window.EJS_emulator.gameManager.loadState(stateData);
                        } else if (typeof window.EJS_emulator.loadState === 'function') {
                            window.EJS_emulator.loadState(stateData);
                        }
                        console.log("[Emulator] State 注入成功！");
                    } catch (err) {
                        console.error("[Emulator] State 注入执行报错:", err);
                    } finally {
                        // 无论注入成功还是失败，最后都要把模拟器唤醒
                        resumeEmulator();
                    }
                }
            };

            reader.readAsArrayBuffer(file);
            e.target.value = '';
        }, 500);
    });

    // 辅助函数：恢复引擎运行
    function resumeEmulator() {
        if (window.EJS_emulator) {
            try {
                if (window.EJS_emulator.gameManager && typeof window.EJS_emulator.gameManager.resume === 'function') {
                    window.EJS_emulator.gameManager.resume();
                } else if (typeof window.EJS_emulator.resume === 'function') {
                    window.EJS_emulator.resume();
                }
            } catch(e) {}
        }
    }
</script>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const romFile = urlParams.get('rom');
    const coreParam = urlParams.get('core');

    if (!romFile) {
        document.body.innerHTML = `
                <div style="text-align:center; line-height: 2;">
                    <div style="font-size: 3rem; margin-bottom: 1rem;">⚠️</div>
                    <h3>SYSTEM ERROR: NO ROM DETECTED</h3>
                    <p style="color: #64748b; font-size: 12px;">Missing "?rom=filename" parameter in URL.</p>
                </div>
            `;
    } else {
        window.EJS_player = '#game';

        // 动态判断模拟器核心
        let core = 'gba';
        if (coreParam) {
            core = coreParam;
        } else {
            const ext = romFile.split('.').pop().toLowerCase();
            if (ext === 'sfc' || ext === 'smc') {
                core = 'snes';
            } else if (ext === 'nes') {
                core = 'nes';
            } else if (ext === 'gb' || ext === 'gbc') {
                core = 'gb';
            }
        }
        window.EJS_core = core;
        window.EJS_gameName = romFile;
        window.EJS_language = 'en';

        // 确保你的 GitHub 仓库中有对应的 rom 文件夹和文件
        window.EJS_gameUrl = '../rom/' + romFile;
        window.EJS_pathtodata = '../emulator_data/';

        window.EJS_color = '#000000';
        window.EJS_startOnLoaded = true;

        // 确保开启了 settings，这样才能呼出原生菜单进行存档管理
        window.EJS_Buttons = {
            playPause: false,
            restart: true,
            mute: true,
            settings: true,
            fullscreen: false
        };

        // 游戏启动完毕后，强制抢夺系统键盘焦点
        window.EJS_onGameStart = function() {
            console.log("[Emulator Core] 游戏已启动，正在获取焦点...");
            window.focus();
            setTimeout(() => {
                const canvas = document.querySelector('#game canvas');
                if(canvas) {
                    canvas.focus();
                }
            }, 500);
        };
    }
</script>

<script src="../emulator_data/loader.js"></script>

<script>
    // 跨窗口通信监听 (针对 iframe 嵌套优化)
    window.addEventListener('message', (event) => {
        if (event.data === 'focus-emulator') {
            const canvas = document.querySelector('canvas');
            if (canvas) {
                canvas.setAttribute('tabindex', '0');
                canvas.focus();
            }
        }
    });

    // 页面加载完成后，告诉父级 iframe 窗口自己准备好了
    window.addEventListener('load', () => {
        if (window.parent) {
            window.parent.postMessage('emulator-ready', '*');
        }
    });
</script>
</body>
</html>
