<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 核心：针对移动端焊死视口，禁止缩放，防止点击按键时页面乱跳 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tukuai Emulator Core - Retro Skin Active</title>

    <!-- 引入 Vue 用于便捷判断设备类型 -->
    <script src="../js/vue.global.js"></script>

    <style>
        :root {
            --ejs-green: #4ade80;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: monospace;
            -webkit-tap-highlight-color: transparent;
        }

        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #game {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* ============================================================ */
        /* ====== 核心：强制划定地盘，谁也别想越界 ====== */
        /* ============================================================ */

        /* 1. 强制游戏画面只准占上半屏 (打败 EmulatorJS 的内联样式) */
        #emulator-app.is-mobile #game {
            height: 50vh !important;
            width: 100vw !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
        }

        #emulator-app.is-mobile #game canvas {
            object-fit: contain !important;
            border-bottom: 2px solid #222;
        }

        /* ============================================================ */
        /* ====== 纯 CSS 绘制的暗黑复古 GBA 下半部机身 ====== */
        /* ============================================================ */
        #emulator-app.is-mobile #retro-skin-overlay {
            display: block;
            position: fixed !important;
            bottom: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 50vh !important;
            z-index: 10;
            pointer-events: none; /* 让点击事件穿透到下面的隐形按键 */

            /* 机身暗黑塑料质感 */
            background: radial-gradient(circle at center, #2a2a2b 0%, #111112 100%);
            border-top: 3px solid #333;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.5);
        }

        /* 十字方向键 (D-Pad) */
        .skin-dpad {
            position: absolute;
            top: 25%;
            left: 10%;
            width: 110px;
            height: 110px;
            background:
                    linear-gradient(to right, transparent 33%, #1a1a1a 33%, #1a1a1a 66%, transparent 66%),
                    linear-gradient(to bottom, transparent 33%, #1a1a1a 33%, #1a1a1a 66%, transparent 66%);
            filter: drop-shadow(0 5px 6px rgba(0,0,0,0.9));
            border-radius: 4px;
        }
        /* 十字键防滑中心点 */
        .skin-dpad::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 16px; height: 16px;
            background: #111;
            border-radius: 50%;
        }

        /* A 和 B 键 (复古红宝石质感) */
        .skin-btn-b, .skin-btn-a {
            position: absolute;
            width: 48px;
            height: 48px;
            background: radial-gradient(circle at 30% 30%, #f43f5e, #991b1b);
            border-radius: 50%;
            box-shadow: 2px 5px 8px rgba(0,0,0,0.8), inset -2px -2px 5px rgba(0,0,0,0.4);
        }
        .skin-btn-b { top: 40%; right: 26%; }
        .skin-btn-a { top: 20%; right: 8%; }

        /* A/B 键的字母刻印 */
        .skin-btn-b::after { content: 'B'; position: absolute; bottom: -25px; left: 16px; color: rgba(255,255,255,0.4); font-weight: bold; font-style: italic; font-family: sans-serif; }
        .skin-btn-a::after { content: 'A'; position: absolute; bottom: -25px; left: 16px; color: rgba(255,255,255,0.4); font-weight: bold; font-style: italic; font-family: sans-serif; }

        /* Select 和 Start 键 (倾斜胶囊状) */
        .skin-btn-select, .skin-btn-start {
            position: absolute;
            bottom: 20%;
            width: 45px;
            height: 12px;
            background: #151515;
            border-radius: 6px;
            transform: rotate(-20deg);
            box-shadow: 1px 3px 5px rgba(0,0,0,0.8);
        }
        .skin-btn-select { left: 35%; }
        .skin-btn-start { left: 52%; }

        .skin-btn-select::after { content: 'SELECT'; position: absolute; bottom: -18px; left: 0; color: rgba(255,255,255,0.4); font-size: 10px; font-weight: bold; letter-spacing: 1px; font-family: sans-serif; }
        .skin-btn-start::after { content: 'START'; position: absolute; bottom: -18px; left: 5px; color: rgba(255,255,255,0.4); font-size: 10px; font-weight: bold; letter-spacing: 1px; font-family: sans-serif; }

        /* 右下角扬声器细节开孔 */
        .skin-speaker {
            position: absolute;
            bottom: 15%;
            right: 10%;
            width: 40px;
            height: 40px;
            background:
                    repeating-linear-gradient(90deg, transparent, transparent 4px, rgba(0,0,0,0.6) 4px, rgba(0,0,0,0.6) 8px);
            border-radius: 50%;
            opacity: 0.5;
            transform: rotate(45deg);
        }

        /* ============================================================ */
        /* ====== 核心：把原生的虚拟按键变成“隐形触摸区”套上去 ====== */
        /* ============================================================ */

        /* 强制覆盖底层虚拟手柄容器 */
        #emulator-app.is-mobile .ejs-controller-container {
            position: fixed !important;
            bottom: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 50vh !important;
            background: transparent !important;
            z-index: 20 !important; /* 必须高于 skin，保证能被摸到 */
        }

        /* 所有按键变成透明人 */
        #emulator-app.is-mobile .ejs-btn {
            opacity: 0 !important;
            border: none !important;
            box-shadow: none !important;
            background: rgba(0,0,0,0) !important;
        }

        /* 将隐形触摸区精准覆盖在咱们画的 CSS 图形上 */
        /* 使用属性模糊匹配 [id*=""] 应对不同内核的命名变化 */
        #emulator-app.is-mobile [id*="dpad"] {
            position: absolute !important;
            top: 25% !important; left: 10% !important;
            width: 110px !important; height: 110px !important;
        }

        #emulator-app.is-mobile [id$="-b"] {
            position: absolute !important;
            top: 40% !important; right: 26% !important;
            width: 48px !important; height: 48px !important;
        }

        #emulator-app.is-mobile [id$="-a"] {
            position: absolute !important;
            top: 20% !important; right: 8% !important;
            width: 48px !important; height: 48px !important;
        }

        #emulator-app.is-mobile [id*="select"] {
            position: absolute !important;
            bottom: 15% !important; left: 32% !important;
            width: 55px !important; height: 40px !important; /* 触摸范围稍微放大 */
        }

        #emulator-app.is-mobile [id*="start"] {
            position: absolute !important;
            bottom: 15% !important; left: 49% !important;
            width: 55px !important; height: 40px !important; /* 触摸范围稍微放大 */
        }

        /* 暴力隐藏多余按键 (L, R, X, Y) 让画面干净纯粹 */
        #emulator-app.is-mobile [id*="ejs-l"],
        #emulator-app.is-mobile [id*="ejs-r"],
        #emulator-app.is-mobile [id$="-x"],
        #emulator-app.is-mobile [id$="-y"] {
            display: none !important;
            pointer-events: none !important;
        }

        /* 顶部系统原生菜单按钮优化 */
        #emulator-app.is-mobile .ejs-menu-btn {
            background: rgba(0,0,0,0.6) !important;
            color: var(--ejs-green) !important;
            position: fixed !important;
            top: 10px !important; right: 10px !important;
            z-index: 9999 !important;
            opacity: 1 !important;
        }

        /* 修复你在截图里的菜单问题：让菜单被限制在上半屏，不挡手柄 */
        #emulator-app.is-mobile .ejs-menu {
            height: 50vh !important;
            top: 0 !important;
        }

    </style>
</head>
<body>
<div id="emulator-app" :class="{ 'is-mobile': isMobile }" style="width:100%; height:100%;">

    <div id="focus-hint" v-if="!isMobile">💡 提示：按键无反应请先【点击游戏画面】。点击底部图标可呼出原生菜单。</div>

    <div id="game-container">
        <div id="game"></div>

        <!-- 手机端专属：纯 CSS 渲染的物理掌机质感外壳 -->
        <div id="retro-skin-overlay" v-if="isMobile">
            <div class="skin-dpad"></div>
            <div class="skin-btn-b"></div>
            <div class="skin-btn-a"></div>
            <div class="skin-btn-select"></div>
            <div class="skin-btn-start"></div>
            <div class="skin-speaker"></div>
        </div>
    </div>

</div>

<script>
    const { createApp, ref, onMounted } = Vue;

    createApp({
        setup() {
            const isMobile = ref(false);

            const checkDevice = () => {
                isMobile.value = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || (window.innerWidth < 768);
                console.log(`[Emulator] Device: ${isMobile.value ? 'Mobile' : 'PC'}`);
            };

            onMounted(() => {
                checkDevice();
                window.addEventListener('resize', checkDevice);
                initEmulator();
            });

            const initEmulator = () => {
                const urlParams = new URLSearchParams(window.location.search);
                const romFile = urlParams.get('rom');
                const coreParam = urlParams.get('core');

                if (!romFile) {
                    document.querySelector('#game').innerHTML = `
                            <div style="text-align:center; line-height: 2; padding: 20px;">
                                <div style="font-size: 3rem;">⚠️</div>
                                <h3>SYSTEM ERROR: NO ROM</h3>
                            </div>
                        `;
                    return;
                }

                window.EJS_player = '#game';

                let core = 'gba';
                if (coreParam) {
                    core = coreParam;
                } else {
                    const ext = romFile.split('.').pop().toLowerCase();
                    if (ext === 'sfc' || ext === 'smc') core = 'snes';
                    else if (ext === 'nes') core = 'nes';
                    else if (ext === 'gb' || ext === 'gbc') core = 'gb';
                }
                window.EJS_core = core;
                window.EJS_gameName = romFile;
                window.EJS_language = 'en';
                window.EJS_gameUrl = '../rom/' + romFile;
                window.EJS_pathtodata = '../emulator_data/';
                window.EJS_color = '#000000';
                window.EJS_startOnLoaded = true;

                window.EJS_Buttons = {
                    playPause: false,
                    restart: true,
                    mute: true,
                    settings: true,
                    fullscreen: false
                };

                if (isMobile.value) {
                    window.EJS_vkEnabled = true;
                }

                const script = document.createElement('script');
                script.src = '../emulator_data/loader.js';
                document.body.appendChild(script);

                window.EJS_onGameStart = function() {
                    window.focus();
                    setTimeout(() => {
                        const canvas = document.querySelector('#game canvas');
                        if(canvas) canvas.focus();
                    }, 500);
                };
            };

            return { isMobile };
        }
    }).mount('#emulator-app');

    window.addEventListener('message', (event) => {
        if (event.data === 'focus-emulator') {
            const canvas = document.querySelector('canvas');
            if (canvas) {
                canvas.setAttribute('tabindex', '0');
                canvas.focus();
            }
        }
    });

    window.addEventListener('load', () => {
        if (window.parent) {
            window.parent.postMessage('emulator-ready', '*');
        }
    });
</script>
</body>
</html>
