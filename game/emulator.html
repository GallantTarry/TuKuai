<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EmulatorJS Core</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: monospace;
            overscroll-behavior: none;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<div id="game"></div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const romFile = urlParams.get('rom');
    const coreParam = urlParams.get('core');

    if (!romFile) {
        document.body.innerHTML = `
            <div style="text-align:center; color: #4ade80; line-height: 2;">
                <div style="font-size: 3rem; margin-bottom: 1rem;">⚠️</div>
                <h3>SYSTEM ERROR: NO ROM DETECTED</h3>
                <p style="color: #64748b; font-size: 12px;">Missing "?rom=filename" parameter in URL.</p>
            </div>
        `;
    } else {
        // 核心参数自动判断
        let core = coreParam || 'gba';
        if (!coreParam) {
            const ext = romFile.split('.').pop().toLowerCase();
            if (ext === 'sfc' || ext === 'smc') core = 'snes';
            else if (ext === 'nes') core = 'nes';
            else if (ext === 'gb' || ext === 'gbc') core = 'gb';
        }

        // =========================================================================
        // 官方标准配置区
        // =========================================================================
        window.EJS_player = '#game';
        window.EJS_core = core;
        window.EJS_gameName = romFile;
        window.EJS_language = 'zh-CN';
        window.EJS_color = '#4ade80';
        window.EJS_startOnLoaded = true;


        // 恢复指向你的本地资源目录
        window.EJS_pathtodata = '../emulator_data/';
        window.EJS_gameUrl = '../rom/' + romFile;

        // 官方的按键和手柄配置
        window.EJS_VirtualGamepadSettings = {
            alpha: 0.5,
            scale: 1.1
        };

        window.EJS_Buttons = {
            playPause: true,
            restart: true,
            mute: true,
            settings: true,
            fullscreen: true,
            saveState: true,
            loadState: true
        };

        // 仅在游戏就绪时通知外部框架（若有），并启动自动保存机制
        window.EJS_onGameStart = function() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage('emulator-ready', '*');
            }

            // 👇 新增功能 1：开启定时自动保存 (Auto-Save) 👇
            // 设置每隔 60 秒自动生成一个即时存档写入浏览器缓存
            setInterval(() => {
                try {
                    // 确保模拟器实例已加载完毕再调用
                    if (window.EJS_emulator && typeof window.EJS_emulator.saveState === 'function') {
                        window.EJS_emulator.saveState();
                        console.log("【系统提示】定时自动存档已静默执行！");
                    }
                } catch (e) {
                    console.warn("自动存档异常:", e);
                }
            }, 60000); // 60000 毫秒 = 60 秒
            // 👆 新增结束 👆
        };

        // 👇 新增功能 2：监听主界面的 postMessage 关机与存档指令 👇
        window.addEventListener('message', function(event) {

            // 收到主界面的 "关闭前保存" 或 "手动保存" 指令
            if (event.data === 'save-before-close' || event.data === 'save-state') {
                try {
                    if (window.EJS_emulator && typeof window.EJS_emulator.saveState === 'function') {
                        window.EJS_emulator.saveState();
                        console.log("【系统提示】收到指令，游戏状态已强制写入本地数据库！");
                    }
                } catch (e) {
                    console.error("强制存档失败:", e);
                }
            }

            // 收到主界面的 "读取存档" 指令
            if (event.data === 'load-state') {
                try {
                    if (window.EJS_emulator && typeof window.EJS_emulator.loadState === 'function') {
                        window.EJS_emulator.loadState();
                        console.log("【系统提示】收到指令，正在从本地数据库读取存档！");
                    }
                } catch (e) {
                    console.error("强制读档失败:", e);
                }
            }
        });
        // 👆 新增结束 👆

        // =========================================================================
        // 触发官方启动序列
        // =========================================================================
        const loaderScript = document.createElement('script');
        loaderScript.src = window.EJS_pathtodata + 'loader.js';
        document.body.appendChild(loaderScript);
    }
</script>
</body>
</html>
