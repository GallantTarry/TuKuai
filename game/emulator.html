<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EmulatorJS Core</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: monospace;
            overscroll-behavior: none;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }
        #game {
            width: 100%;
            height: 100%;
            /* 必须加回这一行！禁止浏览器拦截触摸，直接穿透给游戏画布 */
            touch-action: none !important;
        }
        /* 👇 强制隐藏可能残留的虚拟鼠标小点UI 👇 */
        #ejs-mouse, .ejs-cursor, #ejs-ui-mouse-toggle {
            display: none !important;
        }
    </style>
</head>
<body>

<div id="game"></div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const romFile = urlParams.get('rom');
    const coreParam = urlParams.get('core');

    if (!romFile) {
        document.body.innerHTML = `
            <div style="text-align:center; color: #4ade80; line-height: 2;">
                <div style="font-size: 3rem; margin-bottom: 1rem;">⚠️</div>
                <h3>SYSTEM ERROR: NO ROM DETECTED</h3>
                <p style="color: #64748b; font-size: 12px;">Missing "?rom=filename" parameter in URL.</p>
            </div>
        `;
    } else {
        let core = coreParam || 'gba';
        if (!coreParam) {
            const ext = romFile.split('.').pop().toLowerCase();
            if (ext === 'sfc' || ext === 'smc') core = 'snes';
            else if (ext === 'nes') core = 'nes';
            else if (ext === 'gb' || ext === 'gbc') core = 'gb';
            // 仅仅识别 NDS 扩展名
            else if (ext === 'nds') core = 'nds';
        }

        // =========================================================================
        // 为每个游戏计算独立的唯一 ID，防止存档串区
        // =========================================================================
        let romHash = 0;
        for (let i = 0; i < romFile.length; i++) {
            romHash = (romHash << 5) - romHash + romFile.charCodeAt(i);
            romHash |= 0;
        }
        window.EJS_gameID = Math.abs(romHash);

        // =========================================================================
        // 极简纯净配置区（剥离所有自动化存档与强制数据库设定）
        // =========================================================================
        window.EJS_player = '#game';
        window.EJS_core = core;
        window.EJS_gameName = romFile;
        window.EJS_language = 'zh-CN';
        window.EJS_color = '#4ade80';
        window.EJS_startOnLoaded = true;

        window.EJS_pathtodata = '../emulator_data/';
        window.EJS_gameUrl = '../rom/' + romFile;

        // 👇 新增：仅在判定为 NDS 核心时，才注入专用的防崩溃和固件参数 👇
        if (core === 'nds') {
            window.EJS_mouse = false; // 👈 必须显式声明为 false，彻底干掉“触摸板小点”

            window.EJS_cheats = false; // 屏蔽 NDS 核心特有的作弊引起的内存溢出
            window.EJS_biosUrl = '../emulator_data/nds_bios.zip'; // 挂载 NDS 必须的固件
        }
        // 👆 修改结束：这样就绝对不会影响 GBA 或 SFC 的配置了 👆

        window.EJS_VirtualGamepadSettings = { alpha: 0.5, scale: 1.1 };

        // 恢复完整的控制栏按钮，包含存档导入/导出功能
        window.EJS_Buttons = {
            playPause: true,
            restart: true,
            mute: true,
            settings: true,
            fullscreen: true,

            // --- 即时存档 (随玩随存，类似于虚拟机的快照) ---
            saveState: true,
            loadState: true,
            quickSave: true,   // 添加快捷存档按钮
            quickLoad: true,   // 添加快捷读档按钮

            // --- 实体电池存档 (游戏内真实存档，跨设备、跨核心通用) ---
            saveSavFiles: true, // 👈 核心按钮：将 .sav 存档文件导出并下载
            loadSavFiles: true  // 👈 核心按钮：将外部的 .sav 存档文件导入模拟器
        };

        // 仅保留基础的加载完毕通知逻辑// 仅保留基础的加载完毕通知逻辑
        window.EJS_onGameStart = function() {
            if (!document.getElementById('pixel-font-style')) {
                const style = document.createElement('style');
                style.id = 'pixel-font-style';
                style.innerHTML = `
                    @font-face {
                        font-family: 'ChinesePixel';
                        src: url('../font/zpix.ttf') format('truetype');
                        font-weight: normal;
                        font-style: normal;
                    }
                `;
                document.head.appendChild(style);
            }

            const popup = document.createElement('div');
            popup.innerHTML = '✨ 如果移动端导入失败，可以使用左上角的隐藏导入按钮哦~土块祝您玩的开心！';

            popup.style.cssText = `
                position: absolute;
                top: 20px;
                left: 50%;
                transform: translateX(-50%) translateY(-20px);
                background: rgba(15, 20, 30, 0.85);
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
                color: #4ade80;
                padding: 12px 24px;
                border: 1px solid rgba(74, 222, 128, 0.4);
                border-radius: 12px;
                font-family: 'ChinesePixel', monospace;
                font-size: 16px;
                font-weight: normal;
                letter-spacing: 2px;
                z-index: 9999;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8), 0 0 15px rgba(74, 222, 128, 0.2);
                pointer-events: none;
                opacity: 0;
                transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            `;
            document.body.appendChild(popup);

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    popup.style.opacity = '1';
                    popup.style.transform = 'translateX(-50%) translateY(0)';
                });
            });

            setTimeout(() => {
                popup.style.opacity = '0';
                popup.style.transform = 'translateX(-50%) translateY(-20px)';
                setTimeout(() => popup.remove(), 600);
            }, 3500);

            // =========================================================================
            // 👇 极致隐形 + PC端彻底屏蔽的方案 👇
            // =========================================================================

            // 精准探测：只有包含移动设备标识，或者支持触控屏幕的设备，才会执行注入
            const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || ('ontouchstart' in document.documentElement);

            if (isMobile) {
                const nativeUploadBtn = document.createElement('div');
                nativeUploadBtn.style.cssText = `
                    position: absolute;
                    top: 0;
                    left: 0;
                    width: 20px;  /* 👈 将 80px 改为 20px，极大减小触控死角 */
                    height: 20px; /* 👈 将 80px 改为 20px */
                    z-index: 999999;
                    overflow: hidden;
                `;

                const fileInput = document.createElement('input');
                fileInput.type = 'file';
                fileInput.accept = '.sav,.state';
                fileInput.style.cssText = 'position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;';

                fileInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (!file) return;

                    try {
                        const dt = new DataTransfer();
                        dt.items.add(file);
                        const dropEvent = new DragEvent('drop', {
                            bubbles: true,
                            cancelable: true,
                            dataTransfer: dt
                        });

                        window.dispatchEvent(dropEvent);
                        document.getElementById('game').dispatchEvent(dropEvent);

                        const successMsg = document.createElement('div');
                        successMsg.innerHTML = '✨ 注入: ' + file.name;
                        successMsg.style.cssText = `
                            position: absolute; top: 20px; left: 20px;
                            background: rgba(74, 222, 128, 0.9); color: black;
                            padding: 6px 12px; border-radius: 8px; font-family: monospace;
                            font-weight: bold; font-size: 12px; z-index: 999999;
                            transition: opacity 0.5s ease; box-shadow: 0 0 15px rgba(74, 222, 128, 0.5);
                        `;
                        document.body.appendChild(successMsg);

                        setTimeout(() => {
                            successMsg.style.opacity = '0';
                            setTimeout(() => successMsg.remove(), 500);
                        }, 2000);

                    } catch (err) {
                        alert('底层注入失败: ' + err);
                    }

                    fileInput.value = '';
                });

                nativeUploadBtn.appendChild(fileInput);
                document.body.appendChild(nativeUploadBtn);
            }
        };

        const loaderScript = document.createElement('script');
        loaderScript.src = window.EJS_pathtodata + 'loader.js';
        document.body.appendChild(loaderScript);
    }
</script>
</body>
</html>
