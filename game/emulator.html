<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EmulatorJS Core</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: monospace;
            overscroll-behavior: none;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<div id="game"></div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const romFile = urlParams.get('rom');
    const coreParam = urlParams.get('core');

    if (!romFile) {
        document.body.innerHTML = `
            <div style="text-align:center; color: #4ade80; line-height: 2;">
                <div style="font-size: 3rem; margin-bottom: 1rem;">⚠️</div>
                <h3>SYSTEM ERROR: NO ROM DETECTED</h3>
                <p style="color: #64748b; font-size: 12px;">Missing "?rom=filename" parameter in URL.</p>
            </div>
        `;
    } else {
        let core = coreParam || 'gba';
        if (!coreParam) {
            const ext = romFile.split('.').pop().toLowerCase();
            if (ext === 'sfc' || ext === 'smc') core = 'snes';
            else if (ext === 'nes') core = 'nes';
            else if (ext === 'gb' || ext === 'gbc') core = 'gb';
        }

        // =========================================================================
        // 【核心大补丁 1】：为每个游戏计算独立的唯一 ID，彻底杜绝电池存档互相覆盖！
        // =========================================================================
        let romHash = 0;
        for (let i = 0; i < romFile.length; i++) {
            romHash = (romHash << 5) - romHash + romFile.charCodeAt(i);
            romHash |= 0;
        }
        window.EJS_gameID = Math.abs(romHash); // 为《绿宝石》和《星之卡比》分配绝对独立的房间

        // =========================================================================
        // 官方标准配置区
        // =========================================================================
        window.EJS_player = '#game';
        window.EJS_core = core;
        window.EJS_gameName = romFile;
        window.EJS_language = 'zh-CN';
        window.EJS_color = '#4ade80';
        window.EJS_startOnLoaded = true;

        // 【核心大补丁 2】：强制所有存档行为必须存入浏览器底层数据库，禁止弹出下载！
        window.EJS_defaultOptions = {
            "save-state-location": "browser",
            "save-file-location": "browser"
        };

        // 【核心大补丁 3】：开启电池存档（SRAM）保护。每隔 5 秒强制把游戏内保存的数据同步到手机内存。
        window.EJS_fixedSaveInterval = 5000;

        window.EJS_pathtodata = '../emulator_data/';
        window.EJS_gameUrl = '../rom/' + romFile;

        window.EJS_VirtualGamepadSettings = { alpha: 0.5, scale: 1.1 };
        window.EJS_Buttons = {
            playPause: true, restart: true, mute: true, settings: true,
            fullscreen: true, saveState: true, loadState: true
        };

        // =========================================================================
        // 【核心大补丁 4】：游戏挂载完毕后的自动化接管
        // =========================================================================
        window.EJS_onGameStart = function() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage('emulator-ready', '*');
            }

            // 1. 开机后延迟 1.5 秒，强制命令内核去数据库调取最后一次的即时存档，实现“秒进上次进度”
            setTimeout(() => {
                try {
                    if (window.EJS_emulator && typeof window.EJS_emulator.loadState === 'function') {
                        window.EJS_emulator.loadState();
                        console.log("【系统提示】已自动为您恢复上次的即时存档！");
                    }
                } catch (e) {
                    console.warn("这可能是您第一次运行此游戏，无存档可读", e);
                }
            }, 1500);

            // 2. 每隔 60 秒，自动打一个即时快照，防止手滑杀后台丢档
            setInterval(() => {
                try {
                    if (window.EJS_emulator && typeof window.EJS_emulator.saveState === 'function') {
                        window.EJS_emulator.saveState();
                    }
                } catch (e) {}
            }, 60000);
        };

        const loaderScript = document.createElement('script');
        loaderScript.src = window.EJS_pathtodata + 'loader.js';
        document.body.appendChild(loaderScript);
    }

    // =========================================================================
    // 【核心大补丁 5】：响应主页面的安全关机指令，拔电源前极限存盘
    // =========================================================================
    const emergencySave = () => {
        try {
            if (window.EJS_emulator && typeof window.EJS_emulator.saveState === 'function') {
                window.EJS_emulator.saveState();
                console.log("极限关机存盘完毕！");
            }
        } catch (err) {}
    };

    window.addEventListener('beforeunload', emergencySave);
    window.addEventListener('message', function(event) {
        if (event.data === 'save-before-close') {
            emergencySave();
        }
    });
</script>
</body>
</html>
